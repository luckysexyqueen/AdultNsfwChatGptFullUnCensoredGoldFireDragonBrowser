<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoldFireDragon GGUF Web Runtime Test</title></head>
<body><h1>GGUF 웹 추론 엔진 진단</h1>
<p>이 페이지는 브라우저에 포함된 llama.cpp 기반 Wllama WASM 런타임을 사용합니다. 모델 파일은 서버로 업로드하지 않습니다.</p>
<input id="model" type="file" accept=".gguf"><button id="run">모델 로드 및 한국어 추론 테스트</button>
<pre id="log" aria-live="polite"></pre>
<script type="module">
import { LocalGGUFEngine } from './ai/local-gguf.mjs';
const engine = new LocalGGUFEngine();
const log = document.getElementById('log');
document.getElementById('run').addEventListener('click', async () => {
  const file = document.getElementById('model').files?.[0];
  if (!file) { log.textContent = 'GGUF 파일을 선택하세요.'; return; }
  log.textContent = '엔진 초기화 중...\n';
  const button = document.getElementById('run'); button.disabled = true;
  try {
    const status = await engine.load([file], { contextLength: 2048, useGpu: false, onProgress: text => { log.textContent += text + '\n'; } });
    log.textContent += '모델 로드 성공: ' + status.modelName + '\n추론 시작...\n';
    const answer = await engine.generate([{ role: 'user', content: '안녕하세요. 한국어로 한 문장만 답하세요.' }], {
      maxTokens: 128, temperature: 0.2, onToken: token => { log.textContent += token; }
    });
    log.textContent += '\n\n[PASS] 실제 토큰 생성 성공 (' + answer.length + '자)';
  } catch (error) {
    log.textContent += '\n[FAIL] ' + (error?.stack || error);
  } finally {
    try { await engine.unload(); } catch {}
    button.disabled = false;
  }
});
</script></body></html>
