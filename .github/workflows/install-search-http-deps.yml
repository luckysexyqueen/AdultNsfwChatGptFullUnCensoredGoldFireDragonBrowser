name: Install search HTTP dependencies
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/free-api-local-gguf-engine-20261018
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install google axios --save --no-audit --no-fund
      - run: npm ls google axios --depth=0
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --quiet || (git commit -m 'build: add search HTTP dependencies' && git push)
