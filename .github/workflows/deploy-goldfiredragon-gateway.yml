name: Deploy original GoldFireDragon gateway Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore Git LFS website assets
        run: |
          git lfs install
          git lfs pull || echo '::warning::Some LFS assets are unavailable'
      - name: Build original index.html and browser assets
        run: |
          npm run build:static
          python3 - <<'PY'
          from pathlib import Path
          root = Path('site-dist')
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              if p.stat().st_size < 1024 and p.read_bytes().startswith(b'version https://git-lfs.github.com/spec/v1'):
                  print('Excluding unresolved LFS pointer:', p)
                  p.unlink()
              elif p.stat().st_size > 25 * 1024 * 1024:
                  print('Excluding >25MiB asset from Worker deployment:', p)
                  p.unlink()
          assert (root / 'index.html').is_file(), 'index.html missing'
          assert (root / 'GoldFireDragonBrowser.html').is_file() and (root / 'GoldFireDragonBrowser.html').stat().st_size > 100, 'GoldFireDragonBrowser.html empty or missing: restore original browser UI before deployment'
          assert (root / 'plugins').is_dir(), 'plugins missing'
          assert (root / 'ai').is_dir(), 'AI assets missing'
          PY
      - name: Deploy existing Worker without changing its name
        working-directory: cloudflare-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ba9f503376f9f52c15ea9ee2ee7a39af
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify original Worker website
        run: |
          for i in $(seq 1 12); do
            if curl -fsSL --max-redirs 5 --max-time 20 https://goldfiredragon-jp-web-gateway.choluckyhexsexyqueen.workers.dev/ -o /tmp/gateway.html && grep -qi '<html' /tmp/gateway.html; then
              echo "Worker serves website HTML"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Worker is not serving website HTML"
          curl -sSI --max-redirs 0 --max-time 10 https://goldfiredragon-jp-web-gateway.choluckyhexsexyqueen.workers.dev/ || true
          exit 1

      - name: Verify Japan internet search proxy and browser wiring
        run: |
          set -euo pipefail
          BASE=https://goldfiredragon-jp-web-gateway.choluckyhexsexyqueen.workers.dev
          curl -fsSL --max-time 20 "$BASE/GoldFireDragonBrowser.html" -o /tmp/gfd-browser.html
          grep -q 'api/jp/search-html' /tmp/gfd-browser.html || { echo "::error::Browser search not connected to server proxy"; exit 1; }
          curl -fsSL --max-time 20 "$BASE/api/jp/status" -o /tmp/gfd-jp-status.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/gfd-jp-status.json'))
          assert 'configured' in data, 'Japan gateway API missing'
          print('Japan gateway API reachable:', data)
          PY
          # Validate our Worker response without sending automated requests to Google.
          curl -sS --max-time 20 -D /tmp/gfd-search-headers -o /tmp/gfd-search-result "$BASE/api/jp/search-html?q=Tokyo"
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs
          text=Path('/tmp/gfd-search-headers').read_text()
          lines=text.splitlines()
          status_lines=[line for line in lines if line.startswith('HTTP/')]
          assert any(' 302 ' in line or ' 200 ' in line for line in status_lines), text
          if any(' 200 ' in line for line in status_lines):
              html=Path('/tmp/gfd-search-result').read_text(errors='replace')
              assert '<html' in html.lower(), 'Upstream did not return HTML'
              print('Google Japan upstream HTML response verified')
              raise SystemExit(0)
          location=next((line.split(':',1)[1].strip() for line in lines if line.lower().startswith('location:')),None)
          assert location, 'Google redirect Location header missing'
          parsed=urlparse(location)
          assert parsed.scheme=='https' and parsed.hostname=='www.google.co.jp' and parsed.path=='/search',location
          qs=parse_qs(parsed.query)
          assert qs.get('q')==['Tokyo'] and qs.get('gl')==['jp'] and qs.get('hl')==['ko'],location
          print('Google Japan search redirect verified:',location)
          PY
          echo "Original browser and Google-only Japan search routing verified"
