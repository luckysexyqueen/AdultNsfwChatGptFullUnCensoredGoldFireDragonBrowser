name: GoldFireDragon Pages Single Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - fix/free-api-local-gguf-engine-20261018
    paths:
      - 'GoldFireDragonBrowser.html'
      - 'gfd-3d-viewer.js'
      - 'tests/gfd-3d-browser.mjs'
      - 'google-search-patch.js'
      - 'server.js'
      - 'scripts/web-gateway.mjs'
      - 'scripts/vpn-control.mjs'
      - 'scripts/vpn-egress.mjs'
      - 'scripts/build-static-site.mjs'
      - '.github/workflows/pages-single-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: goldfiredragon-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without Puppeteer browser downloads
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      - name: Check server and gateway syntax
        run: |
          node --check server.js
          node --check scripts/web-gateway.mjs
          node --check scripts/vpn-control.mjs
          node --check scripts/vpn-egress.mjs
      - run: npm run build:static
      - name: Verify browser assets included in Pages artifact
        run: |
          test -s site-dist/GoldFireDragonBrowser.html
          test -s site-dist/google-search-patch.js
          test -s site-dist/gfd-3d-viewer.js
          test -s site-dist/gfd-three.module.js
          test -s site-dist/three.core.js
          grep -q 'GOOGLEJAPAN' site-dist/GoldFireDragonBrowser.html
          grep -q 'google-search-patch.js' site-dist/GoldFireDragonBrowser.html
          grep -q 'gfd-3d-viewer.js' site-dist/GoldFireDragonBrowser.html

      # Browser smoke tests must not block publishing a valid static artifact.
      # Run these separately from the production deployment workflow.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
