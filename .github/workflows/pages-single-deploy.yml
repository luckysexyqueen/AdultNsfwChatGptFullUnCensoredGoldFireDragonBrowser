name: GoldFireDragon Pages Single Deployment

on:
  push:
    branches:
      - fix/free-api-local-gguf-engine-20261018
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: goldfiredragon-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build:static

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for previous GitHub Pages deployment to clear
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            response=$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GH_REPO/pages/deployments?per_page=10" || echo '[]')
            if ! printf '%s' "$response" | node -e '
              let input="";process.stdin.on("data",x=>input+=x);process.stdin.on("end",()=>{try{const rows=JSON.parse(input);if(!Array.isArray(rows))process.exit(0);process.exit(rows.some(d=>d.status==="in_progress"&&d.commit_sha!==process.env.CURRENT_SHA)?1:0)}catch{process.exit(0)}})
            '; then
              echo "Another Pages deployment is in progress (attempt $attempt/20). Waiting..."
              sleep 15
            else
              break
            fi
          done
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
