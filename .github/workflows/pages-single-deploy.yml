name: GoldFireDragon Pages Single Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - fix/free-api-local-gguf-engine-20261018
    paths:
      - 'GoldFireDragonBrowser.html'
      - 'gfd-3d-viewer.js'
      - 'google-search-patch.js'
      - 'tests/gfd-3d-browser.mjs'
      - 'scripts/build-static-site.mjs'
      - '.github/workflows/pages-single-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: goldfiredragon-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build:static
      - name: Verify browser assets included in Pages artifact
        run: |
          test -s site-dist/GoldFireDragonBrowser.html
          test -s site-dist/google-search-patch.js
          test -s site-dist/gfd-3d-viewer.js
          grep -q 'google-search-patch.js' site-dist/GoldFireDragonBrowser.html
          grep -q 'gfd-3d-viewer.js' site-dist/GoldFireDragonBrowser.html

      - name: Install Chromium for 3D browser smoke test
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify 3D browser integration in Chromium
        run: node tests/gfd-3d-browser.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for GitHub Pages environment deployment to finish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The /pages/deployments endpoint does not expose the active
          # deployment status used by deploy-pages. Query Deployments API instead.
          for attempt in $(seq 1 40); do
            deployments=$(curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPO/deployments?environment=github-pages&per_page=20")
            active=0
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              statuses=$(curl --fail --silent --show-error --retry 3 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GH_REPO/deployments/$id/statuses?per_page=1")
              state=$(printf '%s' "$statuses" | node -e '
                let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const a=JSON.parse(s);if(!Array.isArray(a))process.exit(2);process.stdout.write(a[0]?.state||"pending")})
              ')
              case "$state" in
                pending|queued|in_progress|waiting) active=1; echo "Deployment $id is $state";;
              esac
            done < <(printf '%s' "$deployments" | node -e '
              let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const a=JSON.parse(s);if(!Array.isArray(a))process.exit(2);for(const d of a){if(d.sha!==process.env.CURRENT_SHA)console.log(d.id)}})
            ')
            if [ "$active" -eq 0 ]; then
              echo "No conflicting active GitHub Pages environment deployments."
              exit 0
            fi
            echo "Waiting for prior Pages deployment ($attempt/40)..."
            sleep 15
          done
          echo "::error::Previous GitHub Pages deployment remains active. Refusing a conflicting deployment."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
