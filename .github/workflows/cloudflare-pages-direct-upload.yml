name: Deploy full GitHub project web app to existing Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches:
      - fix/free-api-local-gguf-engine-20261018
permissions:
  contents: read
concurrency:
  group: goldfiredragon-cloudflare-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout original GitHub source without modifying it
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
      - name: Restore available LFS files
        run: |
          git lfs install
          git lfs pull || echo "::warning::Some original LFS objects are missing; GitHub cannot supply their contents."
      - name: Build complete supported Cloudflare web distribution
        run: |
          npm run build:static
          cp cloudflare-gateway/pages-worker.mjs site-dist/_worker.js
          python3 - <<'PY'
          from pathlib import Path
          root = Path('site-dist')
          missing = []
          for p in root.rglob('*'):
              if p.is_file() and p.stat().st_size < 1024 and p.read_bytes().startswith(b'version https://git-lfs.github.com/spec/v1\n'):
                  missing.append(str(p.relative_to(root)))
                  p.unlink()
          if missing:
              print('::warning::Unresolved LFS pointers excluded from website: ' + ', '.join(missing[:20]))
          if not (root / 'index.html').is_file():
              raise SystemExit('Missing site-dist/index.html')
          if not (root / '_worker.js').is_file():
              raise SystemExit('Missing Cloudflare API Worker')
          PY
      - name: Deploy to existing goldfiredragon-browser Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2ab77068b2ceb185d13f5c2f07c42264
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN secret with Cloudflare Pages Edit permission"; exit 1; }
          echo "Targeting verified Cloudflare Pages account and existing project"
          npx --yes wrangler@4 pages project list\n          npx --yes wrangler@4 pages deploy site-dist --project-name goldfiredragon-browser --branch fix/free-api-local-gguf-engine-20261018
      - name: Print production URL
        run: echo "https://goldfiredragon-browser.pages.dev"
