name: Plugin compatibility checks
on:
  pull_request:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run plugins:test
      - run: git diff --exit-code -- plugins public/plugins
      - run: npm run build:static
      - uses: actions/upload-artifact@v4
        with:
          name: static-website
          path: site-dist/
          include-hidden-files: true
