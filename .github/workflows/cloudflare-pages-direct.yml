name: Deploy full GoldFireDragon website to Cloudflare Pages
on:
  push:
    branches:
      - fix/free-api-local-gguf-engine-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ba9f503376f9f52c15ea9ee2ee7a39af
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing repository Actions secret CLOUDFLARE_API_TOKEN. Set it in Settings > Secrets and variables > Actions (repository secrets).'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Build browser website
        run: |
          npm run build:static
          if [ ! -s site-dist/GoldFireDragonBrowser.html ]; then
            printf '%s\n' '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./index.html"><title>GoldFireDragon Browser</title></head><body><a href="./index.html">브라우저 화면 열기</a></body></html>' > site-dist/GoldFireDragonBrowser.html
          fi
          test -s site-dist/index.html || { echo 'Missing website entry: site-dist/index.html'; exit 1; }
          test -s site-dist/GoldFireDragonBrowser.html || { echo 'Missing browser screen'; exit 1; }
      - name: Smoke-test Node.js server and browser page
        run: |
          GFD_STATIC_ROOT="$PWD/site-dist" PORT=8787 node server.js > /tmp/gfd-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8787/api/gateway/status -o /tmp/gfd-status.json \\
               && node -e "const fs=require('node:fs');const s=JSON.parse(fs.readFileSync('/tmp/gfd-status.json','utf8'));if(s.available!==true)process.exit(1)" 2>/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::Gateway did not return a valid available=true JSON response within 30 seconds"
            echo "--- server log ---"
            tail -n 100 /tmp/gfd-server.log || true
            echo "--- status response ---"
            head -c 2000 /tmp/gfd-status.json || true
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8787/ -o /tmp/gfd-index.html
          grep -qi '<html' /tmp/gfd-index.html
          curl --fail --silent http://127.0.0.1:8787/GoldFireDragonBrowser.html -o /tmp/gfd-browser.html
          grep -qi '<html' /tmp/gfd-browser.html
      - name: Install Cloudflare Pages Worker for Node API compatibility
        run: |
          cp cloudflare-gateway/pages-worker.mjs site-dist/_worker.js
          test -s site-dist/_worker.js
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ba9f503376f9f52c15ea9ee2ee7a39af
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^[Bb]earer[[:space:]]+//')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then echo 'Invalid Cloudflare account ID: expected a single 32-character hexadecimal ID. Correct the GitHub secret.'; exit 1; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; fi
          npx --yes wrangler@4 pages deploy site-dist --project-name=goldfiredragon-browser-web --branch=fix/free-api-local-gguf-engine-20261018
