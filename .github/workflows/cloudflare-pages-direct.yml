name: Deploy full GoldFireDragon website to Cloudflare Pages
on:
  push:
    branches:
      - fix/free-api-local-gguf-engine-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build site
        run: npm run build:static
      - name: Upload to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-dist --project-name=goldfiredragon-browser --branch=fix/free-api-local-gguf-engine-20261018
