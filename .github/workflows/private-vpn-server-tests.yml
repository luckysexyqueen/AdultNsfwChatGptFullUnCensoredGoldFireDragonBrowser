name: Private VPN server tests
on:
  workflow_dispatch:
  push:
    branches: [fix/free-api-local-gguf-engine-20261018]
    paths:
      - 'private-vpn-server/**'
      - 'tests/private-vpn-server.test.mjs'
      - 'scripts/vpn-egress.mjs'
      - '.github/workflows/private-vpn-server-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix private-vpn-server --ignore-scripts --no-audit --no-fund
      - run: npm run private-vpn:test
