name: Backup full source to Hugging Face and deploy Node server
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfd-full-backup-and-server
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: ChoLuckyHexSexySuccubusQueen135Age/GoldFireDragon-Browser-FULL
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
      - name: Check optional Hugging Face credentials
        id: hf_config
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice::Hugging Face backup skipped: HF_TOKEN not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recover available Git LFS data
        if: steps.hf_config.outputs.ready == 'true'
        run: |
          git lfs install
          git lfs pull || echo "::warning::Unavailable Git LFS objects will be recorded, not silently recovered"
      - name: Snapshot tracked source and models without credentials
        if: steps.hf_config.outputs.ready == 'true'
        run: |
          mkdir -p /tmp/gfd-backup
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C /tmp/gfd-backup
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/gfd-backup')
          missing = []
          excluded = []
          for f in root.rglob('*'):
              if not f.is_file(): continue
              rel = f.relative_to(root).as_posix()
              name = f.name.lower()
              if (name == '.env' or name.startswith('.env.') or
                  re.search(r'(credential|secret|private.key|id_rsa|id_ed25519)', rel, re.I) or
                  f.suffix.lower() in ('.pem', '.key', '.p12', '.pfx', '.ovpn')):
                  f.unlink()
                  excluded.append(rel)
                  continue
              if f.stat().st_size <= 1024 and f.read_bytes().startswith(b'version https://git-lfs.github.com/spec/v1\n'):
                  missing.append(rel)
                  f.unlink()
                  continue
          (root / 'BACKUP_LFS_STATUS.txt').write_text('Unresolved Git LFS pointers (original bytes unavailable):\n' + '\n'.join(missing) + '\n')
          (root / 'BACKUP_EXCLUSIONS.txt').write_text('Credential-like files excluded:\n' + '\n'.join(excluded) + '\n')
          print('Unresolved LFS:', len(missing), 'Excluded sensitive-looking files:', len(excluded))
          PY
      - name: Create private Hugging Face model repository and upload full snapshot
        if: steps.hf_config.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Set HF_TOKEN secret"; exit 1; }
          python3 -m pip -q install huggingface_hub
          python3 scripts/hf-backup-safe.py
  deploy:
    needs: backup
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check optional external Linux server deployment configuration
        id: config
        env:
          SSH_HOST: ${{ secrets.GFD_SSH_HOST }}
          SSH_USER: ${{ secrets.GFD_SSH_USER }}
          SSH_KEY: ${{ secrets.GFD_SSH_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Server not provisioned. Add GFD_SSH_HOST, GFD_SSH_USER, GFD_SSH_KEY to deploy Node/GGUF to an existing Linux VM."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy full application on external Linux VM over SSH
        if: steps.config.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.GFD_SSH_HOST }}
          SSH_USER: ${{ secrets.GFD_SSH_USER }}
          SSH_KEY: ${{ secrets.GFD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GFD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::Set GFD_SSH_KNOWN_HOSTS to a verified SSH host key"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          command -v git >/dev/null
          command -v docker >/dev/null
          mkdir -p "$HOME/goldfiredragon"
          cd "$HOME/goldfiredragon"
          if [ ! -d source/.git ]; then
            git clone --branch fix/free-api-local-gguf-engine-20261018 https://github.com/luckysexyqueen/AdultNsfwChatGptFullUnCensoredGoldFireDragonBrowser.git source
          fi
          cd source
          git fetch origin fix/free-api-local-gguf-engine-20261018
          git checkout -B fix/free-api-local-gguf-engine-20261018 origin/fix/free-api-local-gguf-engine-20261018
          git lfs install
          git lfs pull || echo "Some Git LFS originals unavailable"
          docker build -f Dockerfile.huggingface -t goldfiredragon:latest .
          docker rm -f goldfiredragon || true
          docker run -d --restart unless-stopped --name goldfiredragon -p 7860:7860 goldfiredragon:latest
          REMOTE
