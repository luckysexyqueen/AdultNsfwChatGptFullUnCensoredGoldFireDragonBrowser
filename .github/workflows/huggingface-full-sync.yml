name: Deploy GoldFireDragon static website to Hugging Face via Git
on:
  workflow_dispatch:
  push:
    branches:
      - fix/free-api-local-gguf-engine-20261018
permissions:
  contents: read
concurrency:
  group: huggingface-static-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_SPACE_REPO: ChoLuckyHexSexySuccubusQueen135Age/GoldFireDragon-Browser-FULL
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout GitHub source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
      - name: Authenticate and create free static Space if needed
        shell: bash
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Set HF_TOKEN GitHub Actions secret"; exit 1; }
          python3 -m pip -q install huggingface_hub
          python3 - <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          from huggingface_hub.utils import HfHubHTTPError
          repo = os.environ['HF_SPACE_REPO']
          api = HfApi(token=os.environ['HF_TOKEN'])
          try:
              user = api.whoami().get('name', '')
              print('Authenticated Hugging Face user:', user)
              if user.casefold() != repo.split('/')[0].casefold():
                  sys.exit('::error::HF_TOKEN account does not match Space namespace')
              try:
                  info = api.repo_info(repo_id=repo, repo_type='space')
                  sdk = getattr(getattr(info, 'card_data', None), 'sdk', None)
                  print('Existing Space:', repo, 'SDK:', sdk)
                  if sdk and sdk != 'static':
                      sys.exit('::error::Existing Space is not static. Create a separate Static Space or change its SDK before deploying.')
              except HfHubHTTPError as exc:
                  if exc.response.status_code not in (401, 404):
                      raise
                  api.create_repo(repo_id=repo, repo_type='space', space_sdk='static', private=True, exist_ok=True)
                  print('Created private static Space:', repo)
          except HfHubHTTPError as exc:
              status = getattr(exc.response, 'status_code', 'unknown')
              sys.exit(f'::error::Hugging Face refused Space access/creation (HTTP {status}). Static Spaces may also require account eligibility or billing; inspect HF account settings. Git clone cannot bypass Space creation.')
          PY
      - name: Build static browser assets
        shell: bash
        run: |
          node --version
          git lfs install
          git lfs pull || echo "::warning::Some GitHub LFS objects are missing; pointers will be excluded."
          npm run build:static
          python3 - <<'PY'
          from pathlib import Path
          root = Path('site-dist')
          missing = []
          for file in root.rglob('*'):
              if not file.is_file() or file.stat().st_size > 1024:
                  continue
              data = file.read_bytes()
              if data.startswith(b'version https://git-lfs.github.com/spec/v1\n'):
                  missing.append(str(file.relative_to(root)))
                  file.unlink()
          (root / 'MISSING_LFS_OBJECTS.txt').write_text('\n'.join(missing) + '\n' if missing else 'No unresolved Git LFS pointers.\n')
          print('Skipped unresolved Git LFS objects:', len(missing))
          PY
      - name: Git clone Hugging Face Space and push site
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER="Authorization: Basic $(printf 'oauth2:%s' "$HF_TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH_HEADER" clone "https://huggingface.co/spaces/$HF_SPACE_REPO" /tmp/gfd-space
          cd /tmp/gfd-space
          git config user.name "GoldFireDragon Sync"
          git config user.email "actions@users.noreply.github.com"
          git lfs install
          git lfs track '*.gguf' '*.wasm' '*.bin' '*.data' || true
          git ls-files -z | xargs -0 -r git rm -q --ignore-unmatch --
          cp -a "$GITHUB_WORKSPACE/site-dist/." .
          cat > README.md <<'EOF'
          ---
          title: GoldFireDragon Browser FULL
          emoji: 🐉
          colorFrom: red
          colorTo: yellow
          sdk: static
          ---
          GoldFireDragon Browser static website. The full application source remains in GitHub.
          EOF
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Deploy GoldFireDragon static website from GitHub"
            git -c http.extraheader="$AUTH_HEADER" push origin HEAD:main
          fi
          echo "Deployed: https://huggingface.co/spaces/$HF_SPACE_REPO"
