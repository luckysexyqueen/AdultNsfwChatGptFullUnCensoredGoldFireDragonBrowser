name: Sync complete repository to Hugging Face Space
on:
  workflow_dispatch:
  push:
    branches:
      - fix/free-api-local-gguf-engine-20261018
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
      - name: Check Hugging Face configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          test -n "$HF_TOKEN" || { echo "Missing HF_TOKEN secret"; exit 1; }
          test -n "$HF_SPACE_REPO" || { echo "Missing HF_SPACE_REPO variable (username/space-name)"; exit 1; }
      - name: Create private Hugging Face Docker Space if missing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          python3 -m pip -q install huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          repo = os.environ['HF_SPACE_REPO']
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.create_repo(repo_id=repo, repo_type='space', space_sdk='docker', private=True, exist_ok=True)
          print('Private Hugging Face Docker Space ready:', repo)
          PY
      - name: Prepare complete repository snapshot
        run: |
          git lfs install
          # Missing LFS objects cannot be recovered from Git pointers. Continue with an explicit manifest.
          git lfs pull || echo 'WARNING: Some LFS objects are unavailable; their pointer files will be preserved.'
          mkdir -p /tmp/gfd-hf
          git ls-files -z | tar --null -T - -cf - | (cd /tmp/gfd-hf && tar -xf -)
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/gfd-hf')
          missing = []
          for file in root.rglob('*'):
              if not file.is_file(): continue
              try:
                  if file.stat().st_size > 1024: continue
                  data = file.read_bytes()
                  if data.startswith(b'version https://git-lfs.github.com/spec/v1\\n'):
                      missing.append(f'{file.relative_to(root)}: {data.decode(errors="replace").strip()}')
              except OSError: pass
          (root / 'MISSING_LFS_OBJECTS.txt').write_text('\\n\\n'.join(missing) + '\\n' if missing else 'All checked LFS pointers resolved.\\n')
          print('Unresolved LFS pointer count:', len(missing))
          PY
          cp Dockerfile.huggingface /tmp/gfd-hf/Dockerfile
          if [ -f /tmp/gfd-hf/README.md ]; then mv /tmp/gfd-hf/README.md /tmp/gfd-hf/README.original.md; fi
          cat > /tmp/gfd-hf/README.md <<'EOF'
          ---
          title: GoldFireDragon Browser FULL
          emoji: 🐉
          colorFrom: red
          colorTo: yellow
          sdk: docker
          app_port: 7860
          ---
          GoldFireDragon Browser full repository snapshot.
          EOF
      - name: Publish complete snapshot to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          cd /tmp/gfd-hf
          git init
          git config user.name "GoldFireDragon Sync"
          git config user.email "actions@users.noreply.github.com"
          git lfs install
          # Large binaries use Git LFS; do not commit token files or local credentials.
          git lfs track '*.gguf' '*.safetensors' '*.pt' '*.pth' '*.apk' '*.exe' '*.zip' '*.wasm' || true
          find . -type f \( -name '.env' -o -name '.env.*' -o -name '*credentials*.json' -o -name '*secret*.json' -o -name '*.pem' -o -name '*.key' \) -delete
          git add -A
          git commit -m "Sync complete GoldFireDragon repository snapshot"
          git branch -M main
          git -c http.extraheader="Authorization: Basic $(printf 'oauth2:%s' "$HF_TOKEN" | base64 -w0)" push --force "https://huggingface.co/spaces/$HF_SPACE_REPO" main
