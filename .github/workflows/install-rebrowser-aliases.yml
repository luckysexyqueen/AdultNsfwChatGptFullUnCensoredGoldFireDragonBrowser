name: Install Rebrowser aliases
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/free-api-local-gguf-engine-20261018
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install compatible browser packages
        run: |
          npm install --save 'puppeteer@npm:rebrowser-puppeteer' 'puppeteer-core@npm:rebrowser-puppeteer-core' 'playwright@npm:rebrowser-playwright' 'playwright-core@npm:rebrowser-playwright-core'
          npm ls puppeteer puppeteer-core playwright playwright-core --depth=0
      - name: Save manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet || (git commit -m 'build: install rebrowser aliases' && git push)
