name: Deploy Cloudflare Gateway
on:
  push:
    branches:
      - fix/free-api-local-gguf-engine-20261018
      - main
    paths:
      - cloudflare-gateway/**
      - .github/workflows/cloudflare-gateway.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2ab77068b2ceb185d13f5c2f07c42264' }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing repository Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2ab77068b2ceb185d13f5c2f07c42264' }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\\r\\n\\t ')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\\r\\n\\t ')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then echo 'Invalid Cloudflare account ID: expected a single 32-character hexadecimal ID. Correct the GitHub secret.'; exit 1; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; fi
          cd cloudflare-gateway
          npx --yes wrangler@4 deploy
