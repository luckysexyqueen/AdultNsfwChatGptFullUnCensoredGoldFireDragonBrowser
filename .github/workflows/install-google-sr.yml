name: Install google-sr dependency
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gfd-google-sr-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/free-api-local-gguf-engine-20261018
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install and persist google-sr
        run: |
          npm install google-sr --save --ignore-scripts --no-audit --no-fund
          npm ls google-sr --depth=0
      - name: Commit dependency and lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: install google-sr and update npm lockfile"
            git push origin HEAD:fix/free-api-local-gguf-engine-20261018
          fi
