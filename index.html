              <div class="form-group"><label class="form-label">Google 계정</label><input class="form-input" id="account-url" type="email" value="${escHtml(S.user?.email || "")}" autocomplete="username" placeholder="name@gmail.com"></div>
              <div class="form-group"><label class="form-label">비밀번호</label><input class="form-input" id="account-key" type="password" value="" autocomplete="current-password" placeholder="비밀번호를 입력하세요"></div>
              <div style="display:flex;gap:8px;margin:14px 0 12px;"><button class="auth-btn outline" id="account-google" style="flex:1;margin:0;padding:10px;">Google로 연결</button><button class="auth-btn outline" id="account-sync" style="flex:1;margin:0;padding:10px;">지금 동기화</button></div>
              <div class="auth-divider"><span>또는 이메일 계정</span></div>
              <div class="form-group"><label class="form-label">이메일</label><input class="form-input" id="account-email" type="email" autocomplete="email" placeholder="name@example.com"></div>
              <div class="form-group"><label class="form-label">비밀번호</label><input class="form-input" id="account-password" type="password" autocomplete="current-password" minlength="6" placeholder="6자 이상"></div>
              <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;"><button class="auth-btn outline" id="account-signin" style="width:auto;margin:0;padding:10px 14px;">로그인</button><button class="auth-btn primary" id="account-signup" style="width:auto;margin:0;padding:10px 14px;">회원가입</button></div>
              <div id="account-status" class="form-hint" style="margin-top:14px;min-height:20px;">${S.account?.connected ? `연결됨 · ${escHtml(S.user?.email || S.account.provider || "계정")}` : `기기 전용 모드 · 동기화 대기 ${S.syncPending || 0}건`}</div>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        const close = () => closeModalById("account-modal");
        overlay.querySelector("#account-close")?.addEventListener("click", close);
        overlay.addEventListener("click", (event) => { if (event.target === overlay) close(); });
        const status = overlay.querySelector("#account-status");
        const prepareClient = async () => {
          const url = overlay.querySelector("#account-url").value;
          const key = overlay.querySelector("#account-key").value;
          await saveCloudConfig(url, key);
          const client = await getCloudClient();
          if (!client) throw new Error("동기화 연결을 준비하지 못했습니다.");
          return client;
        };
        overlay.querySelector("#account-google")?.addEventListener("click", async () => {
          try {
            status.textContent = "기기 전용 Google 계정을 준비하는 중…";
            // Google 버튼은 외부 Google/Supabase OAuth를 사용하지 않습니다.
            // 입력한 계정명으로 앱 내부 IndexedDB/LocalForage 로컬 계정을 생성합니다.
            const localEmail = overlay.querySelector("#account-url").value.trim();
            const localPassword = overlay.querySelector("#account-key").value;
            if (!localEmail || !localEmail.includes("@")) throw new Error("Google 계정을 입력하세요.");
            if (localPassword.length < 4) throw new Error("비밀번호를 4자 이상 입력하세요.");
            // 비밀번호 원문은 저장하지 않고 입력 검증에만 사용합니다.
            const localId = `local-google-${btoa(unescape(encodeURIComponent(localEmail))).replace(/[^a-zA-Z0-9]/g, "").slice(0, 24)}-${crypto.randomUUID?.() || Date.now()}`;
            const local = await saveDeviceProfile({
              ...(S.user || {}),
              id: S.user?.localGoogleAccount && S.user?.email === localEmail ? S.user.id : localId,
              username: localEmail.split("@")[0] || "Google 사용자",
              email: localEmail,
              isAnonymous: false,
              localGoogleAccount: true,
              localPasswordConfigured: true,
            });
            setState({ user: local, account: { connected: true, provider: "google-local" }, syncStatus: "기기 내 Google 계정 모드" });
            await loadUserData();
            status.textContent = "Google 계정 모드로 연결했습니다. 모든 데이터는 이 기기 내부에만 저장됩니다.";
            toast("Google 계정 모드가 켜졌습니다. 데이터는 기기에 저장됩니다.", "success", 5000);
          } catch (error) {
            status.textContent = error instanceof Error ? error.message : "기기 전용 Google 계정을 만들지 못했습니다.";
          }
        });
        overlay.querySelector("#account-signin")?.addEventListener("click", async () => {
          try {
            const client = await prepareClient();
            const email = overlay.querySelector("#account-email").value.trim();
            const password = overlay.querySelector("#account-password").value;
            const { error } = await client.auth.signInWithPassword({ email, password });
            if (error) throw error;
            await refreshCloudAccount();
            status.textContent = "계정을 연결하고 동기화했습니다.";
            toast("계정이 연결되었습니다.", "success");
            close();
          } catch (error) {
            status.textContent = error instanceof Error ? error.message : "로그인에 실패했습니다.";
          }
        });
        overlay.querySelector("#account-signup")?.addEventListener("click", async () => {
          try {
            const client = await prepareClient();
            const email = overlay.querySelector("#account-email").value.trim();
            const password = overlay.querySelector("#account-password").value;
            if (!email || password.length < 6) throw new Error("유효한 이메일과 6자 이상 비밀번호를 입력하세요.");
            const { data, error } = await client.auth.signUp({ email, password, options: { data: { username: S.user?.username || "사용자" }, emailRedirectTo: window.location.href } });
            if (error) throw error;
            if (data.session) {
              await refreshCloudAccount();
              toast("회원가입과 계정 연결이 완료되었습니다.", "success");
              close();
            } else {
              status.textContent = "확인 이메일을 보냈습니다. 메일의 링크를 연 뒤 이 페이지로 돌아오면 자동 연결됩니다.";
            }
          } catch (error) {
            status.textContent = error instanceof Error ? error.message : "회원가입에 실패했습니다.";
          }
        });
        overlay.querySelector("#account-sync")?.addEventListener("click", async () => {
          try {
            await prepareClient();
            const profile = await refreshCloudAccount();
            if (!profile) throw new Error("먼저 Google 또는 이메일 계정으로 로그인하세요.");
            await flushSyncQueue();
            status.textContent = `동기화 완료 · 남은 대기 ${S.syncPending || 0}건`;
          } catch (error) {
            status.textContent = error instanceof Error ? error.message : "동기화에 실패했습니다.";
          }
        });
      }

      async function disconnectAccount() {
        try {
          const client = await getCloudClient();
          await client?.auth.signOut();
        } catch (error) {
          console.warn("계정 연결 해제 실패:", error);

        const local = await saveDeviceProfile({ accountId: "", email: "", isAnonymous: true });
        setState({ user: local, account: { connected: false, provider: "" }, dropdownOpen: false, syncStatus: "기기 전용 모드" });
        toast("계정 연결만 해제했습니다. 이 기기의 대화와 프로필은 그대로 유지됩니다.", "info", 5000);
      }

      // ── LOCAL GGUF MODEL MODAL ───────────────────────────────────
      const ggufModelStore = makeStore({ name: "aichat-gguf", storeName: "models" });
      const ggufModelFileStore = makeStore({ name: "aichat-gguf", storeName: "model_files" });
      const MAX_PERSISTED_GGUF_FILE_BYTES = 2 * 1024 * 1024 * 1024;

      function newSavedGGUFId() {
        return `saved-gguf-${crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`}`;

      async function getSavedGGUFModels() {
        const models = [];
        await ggufModelStore.iterate((model) => { if (model?.id) models.push(model); });
        return models.sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
      }

      async function validateGGUFFiles(files) {
        if (!files.length) throw new Error("하나 이상의 GGUF 파일을 선택하세요.");
        const sorted = [...files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        if (sorted.some((file) => !/\.gguf(?:\.part\d+)?$/i.test(file.name) && !/-\d{5}-of-\d{5}$/i.test(file.name))) {
          throw new Error("GGUF 파일과 분할 GGUF 조각만 저장할 수 있습니다.");
        }
        if (sorted.some((file) => !file.size || file.size > MAX_PERSISTED_GGUF_FILE_BYTES)) {
          throw new Error("빈 파일 또는 2GB를 초과하는 GGUF 파일은 브라우저에 저장할 수 없습니다.");
        }
        const header = new Uint8Array(await sorted[0].slice(0, 4).arrayBuffer());
        if (header.length !== 4 || header[0] !== 0x47 || header[1] !== 0x47 || header[2] !== 0x55 || header[3] !== 0x46) {
          throw new Error("선택한 첫 파일이 유효한 GGUF 헤더를 포함하지 않습니다.");
        }
        const totalBytes = sorted.reduce((sum, file) => sum + file.size, 0);
        let estimate = null; try { estimate = await navigator.storage?.estimate?.(); } catch (_) { estimate = null; }
        if (estimate?.quota && estimate.usage + totalBytes > estimate.quota * 0.9) {
          throw new Error(`기기 저장 공간이 부족합니다. 현재 브라우저에 약 ${formatModelSize(Math.max(0, estimate.quota - estimate.usage))}만 남아 있습니다.`);
        }
        return { sorted, totalBytes };
      }

      async function persistGGUFModel(files, options = {}) {
        const { sorted, totalBytes } = await validateGGUFFiles(files);
        const id = newSavedGGUFId();
        const now = new Date().toISOString();
        const parts = [];
        try {
          for (let index = 0; index < sorted.length; index += 1) {
            const file = sorted[index];
            const key = `${id}:${index}`;
            await ggufModelFileStore.setItem(key, file.slice(0, file.size, file.type || "application/octet-stream"));
            parts.push({ key, name: file.name, size: file.size, type: file.type || "application/octet-stream", lastModified: file.lastModified || Date.now() });
          }
          const model = { id, name: sorted[0].name, totalBytes, fileCount: sorted.length, parts, created_at: now, updated_at: now, storage: "indexeddb", category: options.category || "user-imported", source: options.source || "device-file-picker", embeddedInApp: !!options.embeddedInApp, persistent: true, version: 1 };
          await ggufModelStore.setItem(id, model);
          // 가능한 브라우저에서는 저장소가 자동 정리되지 않도록 지속 저장을 요청합니다.
          await navigator.storage?.persist?.().catch(() => false);
          return model;
        } catch (error) {
          for (const part of parts) await ggufModelFileStore.removeItem(part.key).catch(() => {});
          await ggufModelStore.removeItem(id).catch(() => {});
          throw new Error(`GGUF 파일을 기기에 저장하지 못했습니다: ${error instanceof Error ? error.message : "저장 공간 또는 브라우저 오류"}`);
        }
      }

        const models = await getSavedGGUFModels().catch(() => []);
        const existing = models.find((m) => m?.name === modelName || /sexygpt-uncensored-q3_k_m\.gguf/i.test(m?.name || ""));
        if (existing) return markGGUFModelBundled(existing);
        const response = await fetch(window.GoldFireOfflineConfig?.model || new URL("models/" + modelName, document.baseURI).href, { cache: "no-store" });
        if (!response.ok && response.status !== 0) throw new Error("내장 GGUF 모델을 읽을 수 없습니다.");

      async function getSavedGGUFFiles(model) {
        if (!model?.parts?.length) throw new Error("저장된 GGUF 파일 정보를 찾지 못했습니다.");
        const files = [];
        for (const part of model.parts) {

          if (!blob) throw new Error(`저장된 모델 조각을 찾지 못했습니다: ${part.name}`);
          files.push(new File([blob], part.name, { type: part.type || "application/octet-stream", lastModified: part.lastModified || Date.now() }));
        }
        return files;
      }

      async function ensureLocalGGUFForFallback(preferredModelId = "") {
        if (localGGUFLoadPromise) return localGGUFLoadPromise;

        if (!files.length) {

          files = [new File([await response.blob()], "sexygpt-uncensored-q3_k_m.gguf", { type: "application/octet-stream" })];
        }
        let status;
        try {

          await window.LocalGGUF.unload?.().catch(() => {});
          const embeddedUrl = window.GoldFireOfflineConfig?.model || new URL("models/sexygpt-uncensored-q3_k_m.gguf", document.baseURI).href;

        setState({ localModel: { ...status, savedModelId: target?.id || "bundled-sexygpt-uncensored-q3_k_m" } });
        return true;
        })().catch((error) => { localGGUFLoadPromise = null; throw error; });
        return localGGUFLoadPromise;

      async function buildLocalFileContext(attachments = [], gptFiles = [], historyMessages = []) {
        const chunks = [];
        const add = (name, text, limit = 12000) => {
          if (!text) return;
          const clean = String(text).replace(/\u0000/g, "").trim();
          if (clean) chunks.push(`\n\n[파일: ${name}]\n${clean.slice(0, limit)}`);
        };
        for (const a of attachments) {
          if (a?.textContent) add(a.name, a.textContent, 30000);
          if (a?.ocrText) add(`${a.name} (OCR/vision)`, a.ocrText, 20000);
        }
        for (const f of gptFiles || []) {
          add(f.file_name || f.name || "GPT 자료", f.file_content || f.textContent, 16000);
        }
        // 과거 메시지에 연결된 로컬 파일도 다시 읽어 로컬 GGUF가 문맥을 잃지 않게 합니다.
        const ids = [...new Set((historyMessages || []).flatMap((m) => Array.isArray(m.localFileIds) ? m.localFileIds : []))];
        for (const id of ids) {
          const meta = await getFileMeta(id).catch(() => null);
          if (meta?.type === "text" && meta.textContent) add(meta.name, meta.textContent, 12000);
        }
        return chunks.join("");
      }

      async function generateWithLocalGGUF(messages, attachments = [], gptFiles = []) {
        if (!window.LocalGGUF) throw new Error("로컬 GGUF 런타임이 준비되지 않았습니다.");
        if (!window.LocalGGUF.getStatus?.().ready) {
          const requested = S.currentGPT?.local_gguf_model_id || "";
          const loaded = await ensureLocalGGUFForFallback(requested);
          if (!loaded || !window.LocalGGUF.getStatus?.().ready) throw new Error("오프라인 GGUF 엔진이 모델을 로드하지 못했습니다.");
        }
        const localMessages = [{ role: "system", content: KOREAN_ONLY_INSTRUCTION }, ...messages.map((m) => ({ ...m }))];
        const fileContext = await buildLocalFileContext(attachments, gptFiles, messages);
        if (fileContext && localMessages.length) {
          const last = localMessages[localMessages.length - 1];
          last.content = `${last.content || ""}${fileContext}`;
        }
        return window.LocalGGUF.generate(localMessages, {
          maxTokens: Number(localStorage.getItem("gfd-gguf-max-tokens") || 768),
          temperature: Number(localStorage.getItem("gfd-gguf-temperature") || 0.7),
          onToken: (token) => setState({ streamingMsg: `${S.streamingMsg}${token}` }),
        });
      }

            if (!count) return;
            const transfer = new DataTransfer();
            for (let index = 0; index < count; index += 1) {
              const chunks = [];
              for (let offset = 0; ; offset += 24576) {
                const encoded = bridge.getGptBuilderUploadChunk(index, offset, 24576);
                if (!encoded) break;
                const binary = atob(encoded);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
                chunks.push(bytes);
                if (encoded.length < 32768) break;
              }
              const name = bridge.getGptBuilderUploadName(index) || `folder-file-${index + 1}`;
              const type = bridge.getGptBuilderUploadMime(index) || "application/octet-stream";
              transfer.items.add(new File([new Blob(chunks, { type })], name, { type }));

            gptFileInput.files = transfer.files;
            gptFileInput.dispatchEvent(new Event("change", { bubbles: true }));

        });
      }

      // 드래그로 브라우저 패널 / 채팅 화면 분할 비율 조절
      // portrait(세로) = 위아래 드래그로 높이 조절, landscape(가로) = 좌우 드래그로 너비 조절
      function bindBrowserResize() {
        const handle = document.getElementById("brow-resize");
        const brow = document.getElementById("brow");
        if (!handle || !brow) return;
        let dragging = false;
        const apply = (clientX, clientY) => {
          if (browserOrientationQuery.matches) {
            const vw = window.innerWidth;
            const min = vw * 0.2;
            const max = vw * 0.8;
            const w = Math.max(min, Math.min(max, clientX));
            brow.style.width = w + "px";
          } else {
            const vh = window.innerHeight;
            const min = vh * 0.18;
            const max = vh * 0.8;
            const h = Math.max(min, Math.min(max, clientY));
            brow.style.height = h + "px";
          }
        };
        handle.addEventListener("pointerdown", (e) => {
          if (!brow.classList.contains("open")) return;
          dragging = true;
          brow.classList.add("resizing");
          handle.setPointerCapture(e.pointerId);
        });
        handle.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          apply(e.clientX, e.clientY);
        });
        const endDrag = () => {
          if (!dragging) return;
          dragging = false;
          brow.classList.remove("resizing");
        };
        handle.addEventListener("pointerup", endDrag);
        handle.addEventListener("pointercancel", endDrag);
      }

    try{
      const r=await fetch(MODEL_URL(),{cache:"no-store"});
      if(!r.ok && r.status!==0) throw new Error("내장 GGUF 읽기 실패: HTTP "+r.status);
      const b=await r.blob();
      const f=new File([b],MODEL,{type:"application/octet-stream"});
      await window.LocalGGUF.load([f],{contextLength:1024,useGpu:false,onProgress:(m)=>window.dispatchEvent(new CustomEvent("goldfire-local-progress",{detail:String(m)}))});
      window.dispatchEvent(new CustomEvent("goldfire-local-ready",{detail:window.LocalGGUF.getStatus()}));
    }catch(e){
      console.error("[GoldFire] Android local GGUF boot failed",e);
      window.dispatchEvent(new CustomEvent("goldfire-local-error",{detail:String(e?.message||e)}));
    }
  }
  window.addEventListener("goldfire-bundled-model-ready",()=>setTimeout(boot,0));
  setTimeout(boot,800);
})();
</script>
</body>
</html>
