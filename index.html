    <script>
      // Install the bundled GGUF into the same IndexedDB vault used by the local AI UI.
      // The model is copied once; inference remains handled by the existing LocalGGUF/WASM runtime.
      (function installBundledGoldFireModel() {
        const modelName = "sexygpt-uncensored-q3_k_m.gguf";
        const modelUrl = window.GoldFireOfflineConfig?.model || new URL("models/" + modelName, document.baseURI).href;
        const installKey = "goldfire-bundled-model-installed";
        let attempts = 0;
        const run = async () => {
          if (window[installKey]) return;
          if (typeof window.persistGGUFModel !== "function" || typeof window.markGGUFModelBundled !== "function") {
            if (++attempts < 120) setTimeout(run, 500);
            return;
          }
          try {
            const saved = await window.getSavedGGUFModels?.() || [];
            const existing = saved.find((m) => m && (m.name === modelName || String(m.name || "").includes("sexygpt")));
            if (existing) {
              await window.markGGUFModelBundled(existing);
            } else {
              const response = await fetch(modelUrl, { cache: "no-store" });
              if (!response.ok && response.status !== 0) throw new Error("bundled GGUF fetch failed: " + response.status);
              const blob = await response.blob();
              await window.persistGGUFModel([new File([blob], modelName, { type: "application/octet-stream" })], { category: "bundled-apk", source: "apk-assets", embeddedInApp: true });
            }
            localStorage.setItem("gfd-gguf-auto-fallback", "1");
            window[installKey] = true;
            window.dispatchEvent(new CustomEvent("goldfire-bundled-model-ready", { detail: { name: modelName } }));
          } catch (error) {
            console.warn("GoldFire bundled GGUF installation failed:", error);
            if (++attempts < 120) setTimeout(run, 1000);
          }
        };
        setTimeout(run, 0);
      })();
    </script>

    <!-- LocalForage: CDN 제거, 네이티브 IndexedDB 기반 자체 구현으로 대체 (오프라인/WebView 안전) -->
    <script>
      /* ═══════════════════════════════════════════════════════════════
         🗄️  NATIVE INDEXEDDB POLYFILL (localforage 대체)
         - 외부 CDN 의존성 완전 제거 → 오프라인/APK WebView에서도 100% 동작
         - localforage와 동일한 API 제공: getItem/setItem/removeItem/iterate/ready/createInstance
         - 전역 window.localforage 로 노출하여 기존 코드 수정 없이 호환
         ═══════════════════════════════════════════════════════════════ */
      (function () {
        "use strict";

        function openDb(dbName, storeName) {
          return new Promise((resolve, reject) => {
            if (!window.indexedDB) {
              reject(new Error("IndexedDB unsupported"));
              return;
            }
            const req = indexedDB.open(dbName, 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(storeName)) {
                db.createObjectStore(storeName);
              }
            };
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = (e) => reject(e.target.error || new Error("IndexedDB open failed"));
          });
        }

        // 메모리 폴백 (IndexedDB 자체를 못 쓰는 극단적 환경 대비)
        function memoryInstance() {
          const mem = new Map();
          return {
            async getItem(key) {
              return mem.has(key) ? mem.get(key) : null;
            },
            async setItem(key, value) {
              mem.set(key, value);
              return value;
            },
            async removeItem(key) {
              mem.delete(key);
            },
            async clear() {
              mem.clear();
            },
            async keys() {
              return Array.from(mem.keys());
            },
            async iterate(cb) {
              let i = 0;
              for (const [k, v] of mem.entries()) {
                const res = cb(v, k, ++i);
                if (res !== undefined) return res;
              }
            },
            async ready() {
              return true;
            },
          };
        }

        function createInstance(opts) {
          opts = opts || {};
          const dbName = opts.name || "localforage";
          const storeName = opts.storeName || "keyvaluepairs";
          let dbPromise = null;
          let failed = false;

          function getDb() {
            if (failed) return Promise.reject(new Error("indexeddb-unavailable"));
            if (!dbPromise) {
              dbPromise = openDb(dbName, storeName).catch((err) => {
                failed = true;
                console.warn("[IndexedDB] 사용 불가, 메모리 저장소로 대체:", err && err.message);
                throw err;
              });
            }
            return dbPromise;
          }

          const fallback = memoryInstance();
          let useFallback = false;

          function withStore(mode, fn) {
            if (useFallback) return fn(null);
            return getDb()
              .then((db) => {
                return new Promise((resolve, reject) => {
                  try {
                    const tx = db.transaction(storeName, mode);
                    const store = tx.objectStore(storeName);
                    const result = fn(store);
                    tx.oncomplete = () => resolve(result && result.__val !== undefined ? result.__val : result);
                    tx.onerror = () => reject(tx.error);
                  } catch (err) {
                    reject(err);
                  }
                });
              })
              .catch((err) => {
                useFallback = true;
                return fn(null);
              });
          }

          return {
            async getItem(key) {
              if (useFallback) return fallback.getItem(key);
              try {
                return await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readonly");
                      const req = tx.objectStore(storeName).get(key);
                      req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
                      req.onerror = () => reject(req.error);
                    }),
                );
              } catch (e) {
                useFallback = true;
                return fallback.getItem(key);
              }
            },
            async setItem(key, value) {
              if (useFallback) return fallback.setItem(key, value);
              try {
                await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readwrite");
                      tx.objectStore(storeName).put(value, key);
                      tx.oncomplete = () => resolve();
                      tx.onerror = () => reject(tx.error);
                    }),
                );
                return value;
              } catch (e) {
                useFallback = true;
                return fallback.setItem(key, value);
              }
            },
            async removeItem(key) {
              if (useFallback) return fallback.removeItem(key);
              try {
                await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readwrite");
                      tx.objectStore(storeName).delete(key);
                      tx.oncomplete = () => resolve();
                      tx.onerror = () => reject(tx.error);
                    }),
                );
              } catch (e) {
                useFallback = true;
                return fallback.removeItem(key);
              }
            },
            async clear() {
              if (useFallback) return fallback.clear();
              try {
                await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readwrite");
                      tx.objectStore(storeName).clear();
                      tx.oncomplete = () => resolve();
                      tx.onerror = () => reject(tx.error);
                    }),
                );
              } catch (e) {
                useFallback = true;
                return fallback.clear();
              }
            },
            async keys() {
              if (useFallback) return fallback.keys();
              try {
                return await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readonly");
                      const req = tx.objectStore(storeName).getAllKeys();
                      req.onsuccess = () => resolve(req.result || []);
                      req.onerror = () => reject(req.error);
                    }),
                );
              } catch (e) {
                useFallback = true;
                return fallback.keys();
              }
            },
            async iterate(cb) {
              if (useFallback) return fallback.iterate(cb);
              try {
                return await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readonly");
                      const store = tx.objectStore(storeName);
                      const req = store.openCursor();
                      let i = 0;
                      req.onsuccess = (e) => {
                        const cursor = e.target.result;
                        if (cursor) {
                          const res = cb(cursor.value, cursor.key, ++i);
                          if (res !== undefined) {
                            resolve(res);
                            return;
                          }
                          cursor.continue();
                        } else {
                          resolve(undefined);
                        }
                      };
                      req.onerror = () => reject(req.error);
                    }),
                );
              } catch (e) {
                useFallback = true;
                return fallback.iterate(cb);
              }
            },
            async ready() {
              try {
                await getDb();
              } catch (e) {
                useFallback = true;
              }
              return true;
            },
          };
        }

        // 기본(default) 인스턴스 — localforage.getItem(...) 형태의 전역 직접 호출 호환용
        const defaultInstance = createInstance({ name: "localforage", storeName: "keyvaluepairs" });

        window.localforage = {
          getItem: (k) => defaultInstance.getItem(k),
          setItem: (k, v) => defaultInstance.setItem(k, v),
          removeItem: (k) => defaultInstance.removeItem(k),
          clear: () => defaultInstance.clear(),
          keys: () => defaultInstance.keys(),
          iterate: (cb) => defaultInstance.iterate(cb),
          ready: () => defaultInstance.ready(),
          createInstance: createInstance,
        };
      })();
    </script>

    <div id="app"></div>

    <script>
      // ═══════════════════════════════════════════════════════════════
      // 🛡️  최우선 안전망 — CDN 로딩 실패 등 어떤 예외가 나도
      //     로딩 화면이 무한정 떠 있지 않도록 강제로 처리한다.
      // ═══════════════════════════════════════════════════════════════
      window.__bootFailed = false;
      window.__bootReady = false;
      window.addEventListener("error", function (e) {
        // 선택적 CDN/런타임/iframe 리소스 하나가 실패해도 index 전체를 죽이지 않습니다.

      // 8초 안에 부팅이 끝나지 않으면(로딩 화면이 안 사라지면) 강제로 에러 처리
      window.__bootWatchdog = setTimeout(function () {
        var ls = document.getElementById("loading-screen");
        var waitingForKeyInput = document.getElementById("sb-key-overlay");
        if (ls && !ls.classList.contains("hidden") && !window.__bootFailed) {
          window.__bootFailed = true;

        }
      }, 12000);

      // ═══════════════════════════════════════════════════════════════
      // ⚙️  설정 — Supabase URL
      // ═══════════════════════════════════════════════════════════════
      const SUPABASE_URL = "https://shtixmaykwundutbshti.backend.onspace.ai";
      const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/chat-stream`;

      // ═══════════════════════════════════════════════════════════════
      // 🔑  SUPABASE_ANON_KEY 자동 설정 (하드코딩 불필요)
      //     우선순위: ① /env-config.js  (.env의 VITE_SUPABASE_ANON_KEY → generate-env-config.js가 빌드 시 생성)
      //              ② localStorage    (이 기기에 이전에 저장된 값)
      //              ③ 최초 실행 입력폼 (제출 시 localStorage에 저장 → 다음부터는 자동으로 재사용)
      // ═══════════════════════════════════════════════════════════════
      const SB_KEY_STORAGE_NAME = "SUPABASE_ANON_KEY";

      function getEnvAnonKey() {
        try {
          return (window.__ENV__ && window.__ENV__.SUPABASE_ANON_KEY) || "";
        } catch (e) {
          return "";
        }
      }

      function getSavedAnonKey() {
        try {
          return localStorage.getItem(SB_KEY_STORAGE_NAME) || "";
        } catch (e) {
          return "";
        }
      }

      function saveAnonKey(key) {
        try {
          localStorage.setItem(SB_KEY_STORAGE_NAME, key);
        } catch (e) {
          console.warn("localStorage 저장 실패:", e);
        }
      }

      function askAnonKeyViaModal() {
        return new Promise((resolve) => {
          const overlay = document.createElement("div");
          overlay.id = "sb-key-overlay";
          overlay.className = "modal-overlay";
          overlay.innerHTML = `
                  <div class="modal-box" style="max-width:420px;">
                    <div class="modal-header">
                      <div class="modal-title">Supabase 연결 설정</div>
                    </div>
                    <div class="modal-body">
                      <div class="form-group">
                        <label class="form-label">Supabase Anon Key<span class="req">*</span></label>
                        <div class="form-hint">최초 1회만 입력하면 이 기기에 저장되어 다음부터 자동으로 사용됩니다.</div>
                        <input class="form-input" id="sb-key-input" type="text" placeholder="eyJhbGciOi..." autocomplete="off" spellcheck="false" />
                        <div class="sb-key-error" id="sb-key-error"></div>
                      </div>
                      <button class="auth-btn primary" id="sb-key-submit">저장하고 시작하기</button>
                    </div>
                  </div>`;
          document.body.appendChild(overlay);

          const input = overlay.querySelector("#sb-key-input");
          const errEl = overlay.querySelector("#sb-key-error");

          function submit() {
            const val = input.value.trim();
            if (!val) {
              errEl.textContent = "Anon Key를 입력해주세요.";
              input.focus();
              return;
            }
            saveAnonKey(val);
            overlay.remove();
            resolve(val);
          }

          overlay.querySelector("#sb-key-submit").addEventListener("click", submit);
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") submit();
          });
          setTimeout(() => input.focus(), 50);
        });
      }

      async function resolveAnonKey() {
        const fromEnv = getEnvAnonKey();
        if (fromEnv) return fromEnv;
        const fromStorage = getSavedAnonKey();
        if (fromStorage) return fromStorage;
        // 외부 Supabase 키 입력 없이 로컬 IndexedDB 모드로 계속 실행합니다.
        return "";
      }

      // ═══════════════════════════════════════════════════════════════
      // 💾  LOCAL STORAGE PROVIDER (Supabase Mock - Robust Version)
      // ═══════════════════════════════════════════════════════════════
      const LocalDB = {
        async get(store) {
          return (await localforage.getItem(store)) || [];
        },
        async save(store, data) {
          await localforage.setItem(store, data);
        },
      };

      let sb;
      const supabaseReady = (async function initLocalSB() {
        window.addEventListener("online", () => {
          setState({ isOnline: true, syncStatus: "연결 복구됨" });
          void flushSyncQueue();
        });
        window.addEventListener("offline", () => setState({ isOnline: false, syncStatus: "오프라인 · 기기에 저장 중" }));

        const chain = (table) => {
          let filters = [];
          let sortCol = "created_at";
          let ascending = false;

          const p = {
            select: () => p,
            insert: (row) => ({
              select: () => ({
                single: () => ({
                  then: async (resolve) => {
                    const data = await LocalDB.get(table);
                    const newRow = {
                      id: row.id || "id-" + Date.now() + "-" + Math.random().toString(36).slice(2),
                      created_at: new Date().toISOString(),
                      updated_at: new Date().toISOString(),
                      ...row,
                    };
                    data.unshift(newRow);
                    await LocalDB.save(table, data);
                    if (resolve) resolve({ data: newRow, error: null });
                    return { data: newRow, error: null };
                  },
                }),
              }),
            }),
            update: (updates) => ({
              eq: (col, val) => ({
                then: async (resolve) => {
                  const data = await LocalDB.get(table);
                  const idx = data.findIndex((x) => x[col] === val);
                  if (idx !== -1) {
                    data[idx] = { ...data[idx], ...updates, updated_at: new Date().toISOString() };
                    await LocalDB.save(table, data);
                    if (resolve) resolve({ data: data[idx], error: null });
                    return { data: data[idx], error: null };
                  } else {
                    if (resolve) resolve({ data: null, error: { message: "Not found" } });
                    return { data: null, error: { message: "Not found" } };
                  }
                },
              }),
            }),
            delete: () => ({
              eq: (col, val) => ({
                then: async (resolve) => {
                  const data = await LocalDB.get(table);
                  const filtered = data.filter((x) => x[col] !== val);
                  await LocalDB.save(table, filtered);
                  if (resolve) resolve({ error: null });
                  return { error: null };
                },
              }),
            }),
            eq: (k, v) => {
              filters.push({ k, v });
              return p;
            },
            or: (query) => {
              filters.push({ or: query });
              return p;
            },
            order: (col, opts) => {
              sortCol = col;
              ascending = opts?.ascending || false;
              return p;
            },
            single: () => ({
              then: async (resolve) => {
                const { data, error } = await p.then((r) => r);
                const res = { data: data ? data[0] : null, error };
                if (resolve) resolve(res);
                return res;
              },
            }),
            then: async (resolve) => {
              let data = await LocalDB.get(table);
              for (const f of filters) {
                if (f.or) {
                  data = data.filter((x) => x.user_id === S.user?.id || x.is_public === true);
                } else {
                  data = data.filter((x) => x[f.k] === f.v);
                }
              }
              data.sort((a, b) => {
                const va = a[sortCol],
                  vb = b[sortCol];
                if (va < vb) return ascending ? -1 : 1;
                if (va > vb) return ascending ? 1 : -1;
                return 0;
              });
              if (resolve) resolve({ data, error: null });
              return { data, error: null };
            },
          };
          return p;
        };

        sb = {
          auth: {
            getSession: async () => {
              const user = await localforage.getItem("local_user");
              const access_token = getEnvAnonKey() || getSavedAnonKey() || "";
              return { data: { session: user ? { user, access_token } : null } };
            },
            onAuthStateChange: (cb) => {
              return { data: { subscription: { unsubscribe() {} } } };
            },
            signInWithPassword: async ({ email }) => {
              const user = { id: "u-" + Date.now(), email, user_metadata: { username: email.split("@")[0] } };
              await localforage.setItem("local_user", user);
              return { data: { user }, error: null };
            },
            signInWithOtp: () => Promise.resolve({ error: null }),
            verifyOtp: async ({ email }) => {
              const user = { id: "u-" + Date.now(), email, user_metadata: { username: email.split("@")[0] } };
              await localforage.setItem("local_user", user);
              return { data: { user }, error: null };
            },
            updateUser: async ({ data }) => {
              const user = await localforage.getItem("local_user");
              const newUser = { ...user, user_metadata: { ...user.user_metadata, ...data } };
              await localforage.setItem("local_user", newUser);
              return { data: { user: newUser }, error: null };
            },
            signOut: async () => {
              await localforage.removeItem("local_user");
              return { error: null };
            },
          },
          from: (table) => chain(table),
          storage: {
            from: (bucket) => ({
              upload: async (path, file) => {
                const id = "storage-" + path.replace(/[^a-zA-Z0-9]/g, "_");
                await localforage.setItem(id, file);
                return { data: { path }, error: null };
              },
              remove: async (paths) => {
                for (const p of paths) {
                  const id = "storage-" + p.replace(/[^a-zA-Z0-9]/g, "_");
                  await localforage.removeItem(id);
                }
                return { error: null };
              },
              createSignedUrl: async (path) => {
                const id = "storage-" + path.replace(/[^a-zA-Z0-9]/g, "_");
                const blob = await localforage.getItem(id);
                return { data: { signedUrl: blob ? URL.createObjectURL(blob) : "" }, error: null };
              },
            }),
          },
        };

        // 무인증 기기 프로필은 initAuth()에서 단일 경로로 복원합니다.
      })();

      // ═══════════════════════════════════════════════════════════════
      // 📦  LOCALFORAGE STORES (파일 영구 저장) — CDN 실패 대비 폴백 포함
      // ═══════════════════════════════════════════════════════════════
      function makeStore(opts) {
        if (typeof localforage !== "undefined" && localforage.createInstance) {
          return localforage.createInstance(opts);
        }
        // localforage 로드 실패 시: 메모리 기반 더미 스토어로 대체 (새로고침 시 사라짐)
        const mem = new Map();
        return {
          async getItem(k) {
            return mem.has(k) ? mem.get(k) : null;
          },
          async setItem(k, v) {
            mem.set(k, v);
            return v;
          },
          async removeItem(k) {
            mem.delete(k);
          },
          async iterate(cb) {
            let i = 0;
            for (const [k, v] of mem.entries()) {
              cb(v, k, ++i);
            }
          },
          async ready() {
            return true;
          },
        };
      }
      const blobStore = makeStore({ name: "aichat-files", storeName: "blobs" });
      const metaStore = makeStore({ name: "aichat-files", storeName: "meta" });
      const msgFileStore = makeStore({ name: "aichat-files", storeName: "msg_files" });
      // 앱 내부 내장 파일 인덱스: 업로드 파일을 앱 전용 영구 저장소에 귀속합니다.
      const embeddedFileIndexStore = makeStore({ name: "aichat-files", storeName: "embedded_index" });
      const convStore = makeStore({ name: "aichat-offline", storeName: "conversations" });
      const msgStore = makeStore({ name: "aichat-offline", storeName: "messages" });
      // GPT 빌더는 Supabase 설정 여부와 무관하게 이 전용 LocalForage 저장소를 기준으로 동작합니다.
      const localGPTStore = makeStore({ name: "aichat-gpt-builder", storeName: "gpts" });
      const localGPTFileStore = makeStore({ name: "aichat-gpt-builder", storeName: "files" });

      const TEXT_EXTS = new Set([
        "txt",
        "md",
        "csv",
        "json",
        "log",
        "xml",
        "yaml",
        "yml",
        "ts",
        "tsx",
        "js",
        "jsx",
        "py",
        "css",
        "html",
        "sh",
        "env",
        "ini",
        "toml",
        "sql",
        "rs",
        "go",
        "java",
        "kt",
        "swift",
        "c",
        "cpp",
        "h",
        "cs",
        "php",
        "rb",
      ]);
      function fileType(file) {
        const mime = String(file?.type || "").toLowerCase();
        const e = String(file?.name || "").split(".").pop()?.toLowerCase() || "";
        if (mime.startsWith("image/")) return "image";
        if (mime.startsWith("audio/")) return "audio";
        if (mime.startsWith("video/")) return "video";
        if (mime === "application/pdf" || e === "pdf") return "pdf";
        if (mime.startsWith("text/") || mime === "application/json" || mime.includes("xml") || TEXT_EXTS.has(e)) return "text";
        if (["doc","docx","xls","xlsx","ppt","pptx","odt","ods","odp","rtf"].includes(e)) return "office";
        return "binary";
      }
      function fmtSize(b) {
        if (b < 1024) return b + "B";
        if (b < 1048576) return (b / 1024).toFixed(1) + "KB";
        return (b / 1048576).toFixed(1) + "MB";
      }

      async function storeFileLF(file, ctx = {}) {
        const id = `f-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
        const type = fileType(file);
        let textContent;
        if (type === "text") {
          try {
            const raw = await file.text();
            textContent = raw.length > 2000000 ? raw.slice(0, 2000000) + "\n...(생략)" : raw;
          } catch {}
        }
        const meta = {
          id,
          name: file.name,
          mimeType: file.type || "application/octet-stream",
          size: file.size,
          type,
          textContent,
          createdAt: new Date().toISOString(),
          persistent: true,
          // 런타임에 선택한 파일도 앱 내부 저장소에 귀속되는 "내장" 파일로 관리합니다.
          embeddedInApp: true,
          storageScope: "app-internal",
          vaultVersion: 1,
          ...ctx,
        };
        await blobStore.setItem(id, file.slice(0, file.size, file.type));
        await metaStore.setItem(id, meta);
        await embeddedFileIndexStore.setItem(id, {
          id, name: meta.name, mimeType: meta.mimeType, size: meta.size, type: meta.type,
          createdAt: meta.createdAt, embeddedInApp: true, storageScope: "app-internal",
        });
        return meta;
      }
      async function getFileBlob(id) {
        try {
          return await blobStore.getItem(id);
        } catch {
          return null;
        }
      }
      async function getFileMeta(id) {
        try {
          return await metaStore.getItem(id);
        } catch {
          return null;
        }
      }
      async function deleteAppEmbeddedFile(id) {
        if (!id) return;
        await blobStore.removeItem(id).catch(() => {});
        await metaStore.removeItem(id).catch(() => {});
        await embeddedFileIndexStore.removeItem(id).catch(() => {});
      }
      async function getEmbeddedAppFiles() {
        const out = [];
        await embeddedFileIndexStore.iterate(v => { if (v?.embeddedInApp) out.push(v); });
        return out.sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
      }
      async function createObjUrl(id) {
        const b = await getFileBlob(id);
        return b ? URL.createObjectURL(b) : null;
      }
      async function fileToBase64(id) {
        const b = await getFileBlob(id);
        if (!b) return null;
        return new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = (e) => res(e.target.result);
          r.onerror = rej;
          r.readAsDataURL(b);
        });
      }
      async function setMsgFiles(msgId, ids) {
        if (!msgId || !ids.length) return;
        await msgFileStore.setItem(msgId, ids);
      }
      async function getMsgFiles(msgId) {
        try {
          return (await msgFileStore.getItem(msgId)) || [];
        } catch {
          return [];
        }
      }
      async function getMsgFileMetas(msgId) {
        const ids = await getMsgFiles(msgId);
        if (!ids.length) return [];
        const r = await Promise.all(ids.map(getFileMeta));
        return r.filter(Boolean);
      }

      // Offline cache
      async function cacheConv(c) {
        try {
          await convStore.setItem(c.id, c);
          await queueSync("conversation", c);
        } catch (error) {
          console.warn("대화 로컬 저장 실패:", error);
        }
      }
      async function getCachedConvs(uid) {
        const res = [];
        await convStore.iterate((v) => {
          if (v.user_id === uid) res.push(v);
        });
        return res.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
      }
      async function delCachedConv(id) {
        try {
          await convStore.removeItem(id);
          await msgStore.iterate(async (v, k) => {
            if (v.conversation_id === id) await msgStore.removeItem(k);
          });
        } catch {}
      }
      async function cacheMsgLF(m) {
        try {
          await msgStore.setItem(m.id, m);
          await queueSync("message", m);
        } catch (error) {
          console.warn("메시지 로컬 저장 실패:", error);
        }
      }
      async function getCachedMsgs(cid) {
        const res = [];
        await msgStore.iterate((v) => {
          if (v.conversation_id === cid) res.push(v);
        });
        return res.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      }

      // ═══════════════════════════════════════════════════════════════
      // 🤖  LOCAL GPT BUILDER STORAGE
      // ═══════════════════════════════════════════════════════════════
      function newLocalGPTId() {
        return `local-gpt-${crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`}`;
      }

      async function getLocalGPTs(ownerId = S.user?.id) {
        const gpts = [];
        await localGPTStore.iterate((gpt) => {
          if (gpt?.user_id === ownerId) gpts.push(gpt);
        });
        return gpts.sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
      }

      async function saveLocalGPT(record) {
        const next = { ...record, storage: "local", updated_at: new Date().toISOString() };
        await localGPTStore.setItem(next.id, next);
        return next;
      }

      async function getLocalGPTFiles(gptId) {
        const files = [];
        await localGPTFileStore.iterate((file) => {
          if (file?.custom_gpt_id === gptId) files.push({ ...file, isExisting: true, isLocal: true });
        });
        return files.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      }

      async function saveLocalGPTFile(gptId, file) {
        const record = {
          id: file.id || `local-gpt-file-${crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`}`,
          custom_gpt_id: gptId,
          file_name: file.file_name,
          file_size: file.file_size || 0,
          mime_type: file.mime_type || "application/octet-stream",
          file_content: file.file_content || "",
          local_file_id: file.local_file_id || "",
          created_at: file.created_at || new Date().toISOString(),
          storage: "local",
        };
        await localGPTFileStore.setItem(record.id, record);
        return { ...record, isExisting: true, isLocal: true };
      }

      async function deleteLocalGPTFile(file) {
        if (!file?.id) return;
        await localGPTFileStore.removeItem(file.id).catch(() => {});
        if (file.local_file_id) {
          await deleteAppEmbeddedFile(file.local_file_id);
        }
      }

      async function deleteLocalGPT(gptId) {
        const files = await getLocalGPTFiles(gptId);
        for (const file of files) await deleteLocalGPTFile(file);
        await localGPTStore.removeItem(gptId);
      }

      // ═══════════════════════════════════════════════════════════════
      // 💾  DEVICE PROFILE & OPTIONAL CLOUD SYNC
      // ═══════════════════════════════════════════════════════════════
      const profileStore = makeStore({ name: "aichat-profile", storeName: "profile" });
      const syncStore = makeStore({ name: "aichat-profile", storeName: "sync_queue" });
      const DEVICE_PROFILE_KEY = "device-profile-v2";
      const CLOUD_CONFIG_KEY = "cloud-config-v1";
      let cloudClient = null;
      let cloudClientKey = "";

      function newDeviceId() {
        return `device-${crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`}`;
      }

      async function getDeviceProfile() {
        let profile = await profileStore.getItem(DEVICE_PROFILE_KEY).catch(() => null);
        if (!profile || typeof profile.id !== "string") {
          profile = {
            id: newDeviceId(),
            username: "사용자",
            email: "",
            avatar: "",
            bio: "",
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
            isAnonymous: true,
          };
          await profileStore.setItem(DEVICE_PROFILE_KEY, profile);
        }
        return profile;
      }

      async function saveDeviceProfile(changes) {
        const current = await getDeviceProfile();
        const next = { ...current, ...changes, updated_at: new Date().toISOString() };
        // Object URL은 현재 탭에서만 유효하므로 IndexedDB에는 파일 ID와 메타데이터만 저장합니다.
        const persistent = { ...next };
        delete persistent.avatarPreview;
        await profileStore.setItem(DEVICE_PROFILE_KEY, persistent);
        // 기존 로컬 스토리지 어댑터와의 호환성을 유지합니다.
        await localforage.setItem("local_user", persistent).catch(() => {});
        return next;
      }

      async function hydrateProfileMedia(profile) {
        if (!profile?.avatarFileId) return profile;
        const avatarPreview = await createObjUrl(profile.avatarFileId).catch(() => null);
        return avatarPreview ? { ...profile, avatarPreview } : profile;
      }

      function profileAvatarSrc(profile) {
        return profile?.avatarPreview || profile?.avatar || "";
      }

      async function getProfileDocuments(profile = S.user) {
        const documents = Array.isArray(profile?.documents) ? profile.documents : [];
        return documents.filter((document) => document?.id && document?.name);

      async function getCloudConfig() {
        const stored = await profileStore.getItem(CLOUD_CONFIG_KEY).catch(() => null);
        const env = window.__ENV__ || {};
        return {
          url: stored?.url || env.SUPABASE_URL || "",
          anonKey: stored?.anonKey || env.SUPABASE_ANON_KEY || "",
        };
      }

      async function saveCloudConfig(url, anonKey) {
        const normalizedUrl = String(url || "").trim().replace(/\/$/, "");
        const normalizedKey = String(anonKey || "").trim();
        if (!/^https:\/\//i.test(normalizedUrl) || !normalizedKey) {
          throw new Error("유효한 HTTPS Supabase URL과 Anon Key를 입력하세요.");
        }
        await profileStore.setItem(CLOUD_CONFIG_KEY, { url: normalizedUrl, anonKey: normalizedKey });
        cloudClient = null;
        cloudClientKey = "";
      }

      async function getCloudClient() {
        const config = await getCloudConfig();
        if (!config.url || !config.anonKey) return null;
        const key = `${config.url}|${config.anonKey}`;
        if (cloudClient && cloudClientKey === key) return cloudClient;
        const { createClient } = await import("/offline/supabase.bundle.js");
        cloudClient = createClient(config.url, config.anonKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
        });
        cloudClientKey = key;
        return cloudClient;
      }

      async function updateSyncCount() {
        let count = 0;
        await syncStore.iterate(() => {
          count += 1;
        }).catch(() => {});
        if (typeof S !== "undefined") setState({ syncPending: count });
        return count;
      }

      async function queueSync(kind, record) {
        if (!record?.id) return;
        await syncStore.setItem(`${kind}:${record.id}`, {
          kind,
          record: { ...record },
          queued_at: new Date().toISOString(),
          attempts: 0,
        });
        await updateSyncCount();
        if (navigator.onLine) void flushSyncQueue();
      }

      async function flushSyncQueue() {
        if (!navigator.onLine || !S?.account?.connected || S.syncing) return false;
        const client = await getCloudClient().catch(() => null);
        if (!client) return false;
        setState({ syncing: true, syncStatus: "동기화 중" });
        let failed = false;
        try {
          const { data: sessionData } = await client.auth.getSession();
          const accountId = sessionData?.session?.user?.id;
          if (!accountId) return false;
          const jobs = [];
          await syncStore.iterate((job, key) => jobs.push({ job, key }));
          // 프로필 파일을 먼저 올린 뒤 프로필 메타데이터를 반영합니다.
          jobs.sort((a, b) => (a.job.kind === "profileFile" ? -1 : 0) - (b.job.kind === "profileFile" ? -1 : 0));
          for (const { job, key } of jobs) {
            try {
              let error = null;
              if (job.kind === "conversation") {
                ({ error } = await client.from("conversations").upsert({ ...job.record, user_id: accountId }, { onConflict: "id" }));
              } else if (job.kind === "message") {
                ({ error } = await client.from("messages").upsert(job.record, { onConflict: "id" }));
              } else if (job.kind === "profileFile") {
                const blob = await getFileBlob(job.record.id);
                if (!blob) throw new Error("프로필 파일을 이 기기에서 찾지 못했습니다.");
                const safeName = String(job.record.name || "file").replace(/[^a-zA-Z0-9._-]/g, "_");
                const path = `${accountId}/profile/${job.record.id}-${safeName}`;
                ({ error } = await client.storage.from("chat-files").upload(path, blob, {
                  upsert: true,
                  contentType: job.record.mimeType || "application/octet-stream",
                }));
                if (!error) {
                  const profile = await getDeviceProfile();
                  const changes = job.record.role === "profile-avatar"
                    ? { avatarCloudPath: path }
                    : { documents: (profile.documents || []).map((document) => document.id === job.record.id ? { ...document, cloudPath: path } : document) };
                  const updated = await saveDeviceProfile(changes);
                  await queueSync("profile", updated);
                }
              } else if (job.kind === "profile") {
                ({ error } = await client.auth.updateUser({
                  data: {
                    username: job.record.username,
                    avatar_url: job.record.avatar || "",
                    avatar_path: job.record.avatarCloudPath || "",
                    bio: job.record.bio || "",
                    documents: (job.record.documents || []).map(({ id, name, mimeType, size, cloudPath }) => ({ id, name, mimeType, size, cloudPath: cloudPath || "" })),
                  },
                }));
              }
              if (error) throw error;
              await syncStore.removeItem(key);
            } catch (error) {
              failed = true;
              await syncStore.setItem(key, { ...job, attempts: (job.attempts || 0) + 1, last_error: String(error?.message || error) });
            }
          }
          const pending = await updateSyncCount();
          setState({ syncStatus: failed ? "일부 동기화 대기" : pending ? "동기화 대기" : "동기화 완료" });
          return !failed;
        } finally {
          setState({ syncing: false });
        }
      }

      async function pullCloudData() {
        if (!S?.account?.connected) return false;
        const client = await getCloudClient().catch(() => null);
        if (!client) return false;
        const { data: sessionData } = await client.auth.getSession();
        const accountId = sessionData?.session?.user?.id;
        if (!accountId || !S.user?.id) return false;
        const { data: remoteConversations, error: conversationsError } = await client
          .from("conversations")
          .select("*")
          .eq("user_id", accountId)
          .order("updated_at", { ascending: false });
        if (conversationsError) throw conversationsError;
        for (const conversation of remoteConversations || []) {
          await convStore.setItem(conversation.id, { ...conversation, user_id: S.user.id });
          const { data: remoteMessages, error: messagesError } = await client
            .from("messages")
            .select("*")
            .eq("conversation_id", conversation.id)
            .order("created_at", { ascending: true });
          if (messagesError) throw messagesError;
          for (const message of remoteMessages || []) await msgStore.setItem(message.id, message);
        }
        const conversations = await getCachedConvs(S.user.id);
        const currentMessages = S.currentConvId ? await getCachedMsgs(S.currentConvId) : S.messages;
        setState({ conversations, messages: currentMessages, syncStatus: "동기화 완료" });
        return true;
      }

      async function refreshCloudAccount() {
        const client = await getCloudClient().catch(() => null);
        if (!client) return null;
        const { data } = await client.auth.getSession();
        const remoteUser = data?.session?.user;
        if (!remoteUser) return null;
        const device = await getDeviceProfile();
        const linked = await saveDeviceProfile({
          accountId: remoteUser.id,
          email: remoteUser.email || "",
          username: remoteUser.user_metadata?.username || device.username,
          avatar: remoteUser.user_metadata?.avatar_url || device.avatar || "",
          bio: remoteUser.user_metadata?.bio || device.bio || "",
          isAnonymous: false,
        });
        setState({ user: linked, account: { connected: true, provider: remoteUser.app_metadata?.provider || "email" } });
        await queueSync("profile", linked);
        await flushSyncQueue();
        await pullCloudData().catch((error) => console.warn("원격 데이터 수신 동기화 실패:", error));
        return linked;
      }

      function withTimeout(promise, ms, fallback) {
        return new Promise((resolve) => {
          let done = false;
          const timer = setTimeout(() => {
            if (!done) {
              done = true;
              resolve(fallback);
            }
          }, ms);
          promise.then(
            (v) => {
              if (!done) {
                done = true;
                clearTimeout(timer);
                resolve(v);
              }
            },
            () => {
              if (!done) {
                done = true;
                clearTimeout(timer);
                resolve(fallback);
              }
            },
          );
        });
      }

      function universalFilePreview(meta, blob) {

      // Unified document + image intelligence runtime.
      // PDF/DOCX/XLSX parsers and OCR are loaded only when needed; API requests still receive original images.
      const GoldFireDocumentVision = (() => {
        const loaded = {};
        const loadScript = (key, src, globalName) => new Promise((resolve, reject) => {
          if (loaded[key]) return loaded[key].then(resolve, reject);
          if (window[globalName]) return resolve(window[globalName]);
          loaded[key] = new Promise((ok, bad) => {
            const tag = document.createElement("script");
            tag.src = src;
            tag.onload = () => window[globalName] ? ok(window[globalName]) : bad(new Error(`${key} runtime unavailable`));
            tag.onerror = () => bad(new Error(`${key} runtime could not be loaded`));
            document.head.appendChild(tag);
          });
          loaded[key].then(resolve, reject);
        });
        const textFile = (file) => /^(text\/|application\/json|application\/xml)/i.test(file.type || "") || /\.(txt|md|csv|json|xml|html?|css|js|py|java|kt|c|cpp|h|log|rtf)$/i.test(file.name || "");
        async function pdf(file) {
          const lib = await loadScript("pdfjs", "./offline/pdf.min.js", "pdfjsLib");
          lib.GlobalWorkerOptions.workerSrc = "./offline/pdf.worker.min.js";
          const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
          const pages = [];
          for (let i = 1; i <= Math.min(doc.numPages, 40); i++) {
            const page = await doc.getPage(i);
            const content = await page.getTextContent();
            pages.push(content.items.map((x) => x.str || "").join(" "));
          }
          return pages.join("\n");
        }
        async function docx(file) {
          const lib = await loadScript("mammoth", "./offline/mammoth.browser.min.js", "mammoth");
          return (await lib.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value || "";
        }
        async function sheet(file) {
          const lib = await loadScript("xlsx", "./offline/xlsx.full.min.js", "XLSX");
          const book = lib.read(await file.arrayBuffer(), { type: "array", cellDates: true });
          return book.SheetNames.map((name) => `## ${name}\n${lib.utils.sheet_to_csv(book.Sheets[name])}`).join("\n");
        }
        async function ocr(file) {
          const lib = await loadScript("tesseract", "./offline/tesseract.min.js", "Tesseract");
          const logger = (m) => window.dispatchEvent(new CustomEvent("goldfire-vision-progress", { detail: m }));
          if (typeof lib.createWorker === "function") {
            const worker = await lib.createWorker("eng+kor", 1, {
              workerPath: "./offline/tesseract-worker.min.js",
              langPath: "./offline/tessdata",
              corePath: "./offline/tesseract-core.wasm.js",
              logger,
            });
            const result = await worker.recognize(file);
            await worker.terminate();
            return result?.data?.text || "";
          }
          const result = await lib.recognize(file, "eng+kor", { logger });
          return result?.data?.text || "";
        }
        async function extract(file) {
          if (!file) return { text: "", vision: false };
          try {
            if (textFile(file)) return { text: (await file.text()).slice(0, 50000), vision: false };
            if (/\.pdf$/i.test(file.name) || file.type === "application/pdf") return { text: (await pdf(file)).slice(0, 50000), vision: false };
            if (/\.docx$/i.test(file.name) || file.type === "application/vnd.openxmlformats-officedocument.wordprocessingml.document") return { text: (await docx(file)).slice(0, 50000), vision: false };
            if (/\.(xlsx|xls)$/i.test(file.name) || /spreadsheet|ms-excel/i.test(file.type || "")) return { text: (await sheet(file)).slice(0, 50000), vision: false };
            if (/^image\//i.test(file.type || "") || /\.(png|jpe?g|webp|gif|bmp)$/i.test(file.name || "")) return { text: (await ocr(file)).slice(0, 20000), vision: true };
          } catch (error) {
            console.warn("GoldFire document/vision extraction failed:", file.name, error);
          }
          return { text: "", vision: /^image\//i.test(file.type || "") };
        }
        return { extract };
      })();
      window.GoldFireVision = GoldFireDocumentVision;
      async function processFiles(files, convId) {
        const attachments = [];
        for (const file of files) {
          try {
            const meta = await storeFileLF(file, { conversationId: convId });
            const intelligence = await GoldFireDocumentVision.extract(file);
            if (meta.type === "image") {
              if (!navigator.onLine) {
                const b64 = await fileToBase64(meta.id);
                if (b64)
                  attachments.push({
                    name: file.name,
                    mimeType: file.type,
                    type: "image",
                    base64: b64,
                    ocrText: intelligence.text,
                    visionRuntime: true,
                    localId: meta.id,
                  });
              } else {
                const safe = file.name.replace(/[^a-zA-Z0-9._\-]/g, "_");
                const path = `${S.user.id}/chat/${Date.now()}_${safe}`;
                const { data, error } = await sb.storage.from("chat-files").upload(path, file);
                if (error) {
                  const b64 = await fileToBase64(meta.id);
                  if (b64)
                    attachments.push({
                      name: file.name,
                      mimeType: file.type,
                      type: "image",
                      base64: b64,
                      ocrText: intelligence.text,
                      visionRuntime: true,
                      localId: meta.id,
                    });
                } else {
                  const { data: signed, error: signedError } = await sb.storage
                    .from("chat-files")
                    .createSignedUrl(data.path, 3600);
                  if (signedError || !signed?.signedUrl) {
                    const b64 = await fileToBase64(meta.id);
                    if (b64) {
                      attachments.push({
                        name: file.name,
                        mimeType: file.type,
                        type: "image",
                        base64: b64,
                        localId: meta.id,
                      });
                    }
                  } else {
                    attachments.push({
                      name: file.name,
                      mimeType: file.type,
                      type: "image",
                      url: signed.signedUrl,
                      ocrText: intelligence.text,
                      visionRuntime: true,
                      localId: meta.id,
                    });
                  }
                }
              }
            } else if (meta.type === "text") {
              attachments.push({ name: file.name, mimeType: file.type, type: "text", textContent: intelligence.text || meta.textContent, extractedText: true, localId: meta.id });
            } else {
              // 모든 파일은 먼저 기기 IndexedDB에 영구 보관합니다.
              // AI에는 파일 종류/크기/로컬 ID를 전달하고, 지원되는 경우 별도 추출기가 내용을 읽습니다.
              attachments.push({ name: file.name, mimeType: file.type || "application/octet-stream", type: meta.type, size: file.size, extractedText: !!intelligence.text, textContent: intelligence.text || "", localId: meta.id });
            }
          } catch (e) {
            console.error(e);
            toast(`파일 처리 실패: ${file.name}`, "error");
          }
        }
        return attachments;
      }

      async function finalizeAssistantResponse(full, convId, isGuest, currentMsgs, trimmed, displayContent) {
        const assistantMessage = {
          id: `tmp-${Date.now()}`,
          conversation_id: convId,
          role: "assistant",
          content: full,
          created_at: new Date().toISOString(),
        };

        if (isGuest) {
          assistantMessage.id = `msg-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
          setState({ messages: [...S.messages, assistantMessage], streamingMsg: "", isStreaming: false });
          await cacheMsgLF(assistantMessage).catch(() => {});
        } else {
          const { data, error } = await sb
            .from("messages")
            .insert({ conversation_id: convId, role: "assistant", content: full })
            .select()
            .single();
          const finalMessage = error ? assistantMessage : { ...data };
          setState({ messages: [...S.messages, finalMessage], streamingMsg: "", isStreaming: false });
          if (!error) await cacheMsgLF(finalMessage).catch(() => {});
        }

        if (currentMsgs.length === 1) {
          const newTitle = trimmed.slice(0, 50) || displayContent.slice(0, 50);
          if (!isGuest) {
            sb.from("conversations")
              .update({ title: newTitle, updated_at: new Date().toISOString() })
              .eq("id", convId)
              .then(() => {});
          }
          const updatedAt = new Date().toISOString();
          const updatedConversations = S.conversations.map((conversation) =>
            conversation.id === convId ? { ...conversation, title: newTitle, updated_at: updatedAt } : conversation,
          );
          setState({ conversations: updatedConversations });
          const updatedConversation = updatedConversations.find((conversation) => conversation.id === convId);
          if (updatedConversation) await cacheConv(updatedConversation).catch(() => {});
        }
      }

      const KOREAN_ONLY_INSTRUCTION = "[언어 정책] 반드시 한국어로만 답변하세요. 사용자가 외국어로 입력하거나 외국어 문서·이미지를 제공해도 내용을 이해한 뒤 한국어로 번역하여 출력하세요. 고유명사·코드·URL·파일명처럼 원문 보존이 필요한 경우를 제외하고 외국어 문장을 그대로 출력하지 마세요.";
      async function sendMessage(content, filesToSend = []) {
        if (!S.user) {
          toast("게스트 로그인 또는 로그인이 필요합니다", "error");
          return false;
        }
        const trimmed = content.trim();
        if (!trimmed && filesToSend.length === 0) return false;
        if (S.isStreaming) return false;

        let convId = S.currentConvId;
        let savedMsgId = null;
        const tempId = `temp-${Date.now()}`;
        const isGuest = !!S.user?.isAnonymous || !navigator.onLine;

        // Determine system prompt / instructions
        let sysPrompt = S.currentGPT?.system_prompt;
        let instructions = S.currentGPT?.instructions;
        if (convId && !S.currentGPT) {
          const cv = S.conversations.find((c) => c.id === convId);
          if (cv) {
            sysPrompt = cv.system_prompt;
            instructions = cv.instructions;
          }
        }

        // Create conversation if needed
        if (!convId) {
          const title = trimmed.slice(0, 50) || filesToSend[0]?.name || "새 대화";
          if (isGuest) {
            const nc = {
              id: `local-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
              user_id: S.user.id,
              title,
              custom_gpt_id: S.currentGPT?.id || null,
              system_prompt: sysPrompt || "",
              instructions: instructions || "",
              created_at: new Date().toISOString(),
              updated_at: new Date().toISOString(),
            };
            convId = nc.id;
            setState({ conversations: [nc, ...S.conversations], currentConvId: convId });
            await cacheConv(nc).catch(() => {});
          } else {
            const { data, error } = await sb
              .from("conversations")
              .insert({
                user_id: S.user.id,
                title,
                custom_gpt_id: S.currentGPT?.id || null,
                system_prompt: sysPrompt || "",
                instructions: instructions || "",
              })
              .select()
              .single();
            if (error) {
              toast("대화 생성 실패", "error");
              return;
            }
            convId = data.id;
            setState({ conversations: [data, ...S.conversations], currentConvId: convId });
            await cacheConv(data).catch(() => {});
          }
        }

        // Process files
        let chatAttachments = [];
        if (filesToSend.length > 0) {
          chatAttachments = await processFiles(filesToSend, convId);
        }
        const localFileIds = chatAttachments.map((a) => a.localId).filter(Boolean);

        // Build display content
        const imgCnt = chatAttachments.filter((a) => a.type === "image").length;
        const displayContent = trimmed || (imgCnt > 0 ? `📷 이미지 ${imgCnt}개` : `📎 파일 ${filesToSend.length}개`);

        const userMsg = {
          id: tempId,
          conversation_id: convId,
          role: "user",
          content: displayContent,
          created_at: new Date().toISOString(),
          localFileIds: localFileIds.length > 0 ? localFileIds : undefined,
        };
        const currentMsgs = [...S.messages, userMsg];
        setState({ messages: currentMsgs, isStreaming: true, streamingMsg: "", attachedFiles: [] });

        // Save user message
        if (isGuest) {
          savedMsgId = `msg-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
          const savedMsg = { ...userMsg, id: savedMsgId };
          await cacheMsgLF(savedMsg).catch(() => {});
          setState({ messages: S.messages.map((m) => (m.id === tempId ? savedMsg : m)) });
        } else {
          const { data, error } = await sb
            .from("messages")
            .insert({ conversation_id: convId, role: "user", content: displayContent })
            .select()
            .single();
          if (!error) {
            savedMsgId = data.id;
            const savedMsg = { ...data, localFileIds: localFileIds.length > 0 ? localFileIds : undefined };
            await cacheMsgLF(savedMsg).catch(() => {});
            setState({ messages: S.messages.map((m) => (m.id === tempId ? savedMsg : m)) });
          }
        }

        // Link files to message
        if (localFileIds.length > 0 && savedMsgId) {
          await setMsgFiles(savedMsgId, localFileIds).catch(() => {});
        }

        // 오프라인/API 장애 대비: 현재 GPT에 연결된 GGUF → 앱 저장 GGUF 순으로 자동 폴백합니다.
        if (!navigator.onLine && !S.localModel?.ready) {
          try { await ensureLocalGGUFForFallback(S.currentGPT?.local_gguf_model_id || ""); } catch (e) { console.warn("offline GGUF fallback 준비 실패:", e); }
        }
        if (!navigator.onLine && !S.localModel?.ready) {
          setState({ isStreaming: false, streamingMsg: "" });
          toast("오프라인 GGUF 엔진을 준비하지 못했습니다. 내장 모델 파일을 확인하세요.", "error", 6000);
          return true;
        }

        // 선택된 로컬 GGUF 모델은 네트워크 요청 없이 현재 브라우저에서 실행합니다.
        if (S.localModel?.ready && window.LocalGGUF) {
          try {
            const localMessages = [{ role: "system", content: KOREAN_ONLY_INSTRUCTION }];
            if (sysPrompt) localMessages.push({ role: "system", content: sysPrompt });
            if (instructions) localMessages.push({ role: "system", content: instructions });
            localMessages.push(...currentMsgs.map((message) => ({ role: message.role, content: message.content })));

            const fileContext = await buildLocalFileContext(chatAttachments, S.currentGPTFiles, currentMsgs);
            if (fileContext && localMessages.length) localMessages[localMessages.length - 1].content += fileContext;
            if (chatAttachments.some((attachment) => attachment.type === "image")) {
              toast("현재 로컬 텍스트 모델은 이미지 입력을 분석하지 않습니다. 이미지 없이 텍스트로 응답합니다.", "info", 4500);
            }

            const full = await window.LocalGGUF.generate(localMessages, {
              maxTokens: Number(localStorage.getItem("gfd-gguf-max-tokens") || 768),
              temperature: Number(localStorage.getItem("gfd-gguf-temperature") || 0.7),
              onToken: (token) => setState({ streamingMsg: `${S.streamingMsg}${token}` }),
            });
            if (!String(full || "").trim()) throw new Error("로컬 GGUF가 빈 응답을 반환했습니다.");
            await finalizeAssistantResponse(full, convId, isGuest, currentMsgs, trimmed, displayContent);
            setState({ localModel: window.LocalGGUF.getStatus() });
            return true;
          } catch (error) {
            console.error("local GGUF error:", error);
            setState({ isStreaming: false, streamingMsg: "", localModel: window.LocalGGUF.getStatus() });
            toast(error instanceof Error ? error.message : "로컬 모델 응답 생성에 실패했습니다.", "error", 6000);
            // 사용자 메시지는 이미 로컬에 저장되었으므로 중복 전송을 막기 위해 입력은 비웁니다.
            return !!savedMsgId;
          }
        }

        // Stream from AI
        try {
          const {
            data: { session },
          } = await sb.auth.getSession();
          let token = session?.access_token || "";
          if (!token || token === "local-token" || token === "guest-token") {
            token = getEnvAnonKey() || getSavedAnonKey();
          }
          if (!token) token = await resolveAnonKey();
          if (!token) throw new Error("Supabase Anon Key가 필요합니다. 설정 후 다시 시도하세요.");

          const resp = await fetch(EDGE_FUNCTION_URL, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: currentMsgs.map((m) => ({ role: m.role, content: m.content })),
              systemPrompt: [KOREAN_ONLY_INSTRUCTION, sysPrompt].filter(Boolean).join("\n\n"),
              instructions: [KOREAN_ONLY_INSTRUCTION, instructions].filter(Boolean).join("\n\n"),
              gptFiles: S.currentGPTFiles.length > 0 ? S.currentGPTFiles : undefined,
              chatAttachments: chatAttachments.length > 0 ? chatAttachments : undefined,
              lastUserContent: trimmed,
            }),
          });

          if (!resp.ok) {
            let errMsg = "AI 응답 실패";
            try {
              const t = await resp.text();
              try {
                const j = JSON.parse(t);
                errMsg = j.error || j.message || errMsg;
              } catch {
                errMsg = t.slice(0, 150) || errMsg;
              }
            } catch {}
            if (resp.status === 402) errMsg = "AI 서비스 크레딧이 부족합니다. 관리자에게 문의하세요";
            else if (resp.status === 429) errMsg = "요청이 너무 많습니다. 잠시 후 다시 시도해주세요";
            else if (resp.status >= 500) errMsg = "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요";
            throw new Error(errMsg);
          }

          if (!resp.body) throw new Error("AI 응답 스트림을 받지 못했습니다");
          const reader = resp.body.getReader();
          const dec = new TextDecoder();
          let full = "",
            buf = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split("\n");
            buf = lines.pop() || "";
            for (const line of lines) {
              if (!line.includes("data:")) continue;
              const js = line.replace(/^data:\s*/, "").trim();
              if (js === "[DONE]") continue;
              try {
                const p = JSON.parse(js);
                const d = p.choices?.[0]?.delta?.content || "";
                if (d) {
                  full += d;
                  setState({ streamingMsg: full });
                }
              } catch {}
            }
          }

          // 마지막 청크가 줄바꿈 없이 종료된 SSE 응답도 처리합니다.
          const remaining = (buf + dec.decode()).trim();
          if (remaining.startsWith("data:")) {
            try {
              const pending = JSON.parse(remaining.replace(/^data:\\s*/, "").trim());
              const delta = pending.choices?.[0]?.delta?.content || "";
              if (delta) {
                full += delta;
                setState({ streamingMsg: full });
              }
            } catch {}
          }

          if (!full.trim()) throw new Error("AI가 응답을 생성하지 못했습니다");

          await finalizeAssistantResponse(full, convId, isGuest, currentMsgs, trimmed, displayContent);
          return true;
        } catch (err) {
          console.error("sendMessage API error:", err);
          // API 실패/타임아웃/서버 오류를 로컬 GGUF로 자동 대체합니다.
          try {
            if (!S.localModel?.ready && (S.ggufAutoFallback || S.currentGPT?.local_gguf_model_id)) await ensureLocalGGUFForFallback(S.currentGPT?.local_gguf_model_id || "");
            if (S.localModel?.ready && window.LocalGGUF) {
              const fallbackMessages = [];
              if (sysPrompt) fallbackMessages.push({ role: "system", content: sysPrompt });
              if (instructions) fallbackMessages.push({ role: "system", content: instructions });
              fallbackMessages.push(...currentMsgs.map((m) => ({ role: m.role, content: m.content })));
              const full = await generateWithLocalGGUF(fallbackMessages, chatAttachments, S.currentGPTFiles);
              await finalizeAssistantResponse(full, convId, isGuest, currentMsgs, trimmed, displayContent);
              setState({ localModel: window.LocalGGUF.getStatus() });
              toast("API를 사용할 수 없어 저장된 GGUF 모델로 전환했습니다.", "info", 3500);
              return true;
            }
          } catch (fallbackError) {
            console.error("GGUF fallback error:", fallbackError);
          }
          setState({ isStreaming: false, streamingMsg: "" });
          if (!savedMsgId) setState({ messages: S.messages.filter((m) => m.id !== tempId) });
          toast(err instanceof Error ? err.message : "메시지 전송에 실패했습니다", "error");
          // 사용자 메시지가 이미 저장된 경우 입력을 보존하면 같은 메시지가 중복 전송될 수 있습니다.
          return !!savedMsgId;
        }
      }

      // ═══════════════════════════════════════════════════════════════
      // 🤖  GPT BUILDER
      // ═══════════════════════════════════════════════════════════════
      let gptBuilderFiles = []; // tmp before save
      let gptModalPendingDeletes = []; // 기존 DB 파일 중 삭제 예정 목록

      async function discardUnsavedGPTFiles() {
        for (const file of gptModalFiles || []) {
          if (!file.isExisting && file.local_file_id) {
            await blobStore.removeItem(file.local_file_id).catch(() => {});
            await metaStore.removeItem(file.local_file_id).catch(() => {});
          }
        }
        gptBuilderFiles = [];
        gptModalFiles = [];
        gptModalPendingDeletes = [];
      }

      // 커스텀 GPT 파일은 Supabase가 없어도 LocalForage에서 즉시 복원됩니다.
      async function loadGPTFiles(gptId) {
        try {
          return await getLocalGPTFiles(gptId);
        } catch (error) {
          console.error("로컬 GPT 파일 로드 실패:", error);
          return [];
        }
      }

      async function deleteGPTFileFromDB(file) {
        try {
          await deleteLocalGPTFile(file);
        } catch (error) {
          console.error("로컬 GPT 파일 삭제 실패:", error);
        }
      }

      async function saveGPT(formData) {
        const uid = S.user?.id;
        if (!uid) {
          toast("기기 프로필을 준비한 뒤 다시 시도하세요.", "error");
          return false;
        }
        const editing = S.gptBuilderEditing;
        try {
          const now = new Date().toISOString();
          const gpt = await saveLocalGPT({
            ...(editing || { id: newLocalGPTId(), user_id: uid, created_at: now }),
            user_id: uid,
            name: formData.name,
            description: formData.description,
            system_prompt: formData.systemPrompt,
            instructions: formData.instructions,
            avatar_url: formData.avatarUrl || "",
            local_gguf_model_id: formData.localGgufModelId || "",
            is_public: false, // 로컬 모드에서는 다른 기기·사용자와 자동 공유하지 않습니다.
            updated_at: now,
          });
          for (const file of gptModalPendingDeletes) await deleteGPTFileFromDB(file);
          for (const file of gptBuilderFiles) {
            if (!file.isExisting) await saveLocalGPTFile(gpt.id, file);
          }
          const customGPTs = await getLocalGPTs(uid);
          gptBuilderFiles = [];
          gptModalFiles = [];
          gptModalPendingDeletes = [];

      function renderAuthExtra() {
        const el = document.getElementById("auth-extra");

        if (authState.isLogin) {
          el.innerHTML = `
            <input class="auth-input" type="password" id="auth-pw" placeholder="비밀번호" value="${authState.pw}" ${authState.loading ? "disabled" : ""}>

            </div>`;
          el.querySelector("#auth-pw").addEventListener("input", (e) => {
            authState.pw = e.target.value;
          });

          el.querySelector("#btn-skip").addEventListener("click", doSkipLogin);
        } else if (!authState.otpSent) {
          el.innerHTML = `<button class="auth-btn primary" id="btn-otp" ${authState.loading ? "disabled" : ""}>
            ${authState.loading ? "전송 중..." : "인증 코드 받기"}
          </button>`;
          el.querySelector("#btn-otp").addEventListener("click", doSendOtp);
        } else {
          el.innerHTML = `

            <button class="auth-btn primary" id="btn-register" ${authState.loading ? "disabled" : ""}>
              ${authState.loading ? "가입 중..." : "회원가입 완료"}
            </button>`;
          el.querySelector("#auth-otp").addEventListener("input", (e) => {
            authState.otp = e.target.value;
          });
          el.querySelector("#auth-pw2").addEventListener("input", (e) => {
            authState.pw = e.target.value;
          });
          el.querySelector("#btn-register").addEventListener("click", doRegister);
        }
      }

      function bindAuth() {
        document.getElementById("auth-email")?.addEventListener("input", (e) => {
          authState.email = e.target.value;
        });
        document.getElementById("auth-switch")?.addEventListener("click", () => {
          authState.isLogin = !authState.isLogin;
          authState.otpSent = false;
          authState.otp = "";
          renderAuth();
        });
      }

      async function doSendOtp() {
        authState.loading = true;
        renderAuthExtra();
        const { error } = await sb.auth.signInWithOtp({ email: authState.email, options: { shouldCreateUser: true } });
        authState.loading = false;
        if (error) {
          toast(error.message, "error");
          renderAuthExtra();
          return;
        }
        authState.otpSent = true;
        toast("인증 코드가 이메일로 전송되었습니다", "success");
        renderAuthExtra();
      }

      async function doRegister() {
        authState.loading = true;
        renderAuthExtra();
        const { data, error } = await sb.auth.verifyOtp({
          email: authState.email,
          token: authState.otp,
          type: "email",
        });
        if (error) {
          authState.loading = false;
          toast(error.message, "error");
          renderAuthExtra();
          return;
        }
        const { error: ue } = await sb.auth.updateUser({
          password: authState.pw,
          data: { username: authState.email.split("@")[0] },
        });
        if (ue) {
          authState.loading = false;
          toast(ue.message, "error");
          renderAuthExtra();
          return;
        }
        setState({ user: mapUser(data.user), view: "chat" });
        await loadUserData();
        authState.loading = false;
      }

      async function doLogin() {
        authState.loading = true;
        renderAuthExtra();
        const { data, error } = await sb.auth.signInWithPassword({ email: authState.email, password: authState.pw });
        if (error) {
          authState.loading = false;
          toast(error.message, "error");
          renderAuthExtra();
          return;
        }
        setState({ user: mapUser(data.user), view: "chat" });
        await loadUserData();
        authState.loading = false;
      }

      const PROFILE_IMAGE_MAX_BYTES = 5 * 1024 * 1024;
      const PROFILE_DOCUMENT_MAX_BYTES = 10 * 1024 * 1024;
      const PROFILE_DOCUMENT_TOTAL_MAX_BYTES = 25 * 1024 * 1024;
      const PROFILE_DOCUMENT_MAX_COUNT = 10;

      async function saveProfileAvatar(file) {
        if (!file?.type?.startsWith("image/")) throw new Error("프로필 이미지는 이미지 파일만 사용할 수 있습니다.");
        if (!file.size || file.size > PROFILE_IMAGE_MAX_BYTES) throw new Error("프로필 이미지는 5MB 이하만 사용할 수 있습니다.");
        const oldAvatarId = S.user?.avatarFileId;
        const meta = await storeFileLF(file, { profileId: S.user?.id, role: "profile-avatar" });
        await queueSync("profileFile", { ...meta, role: "profile-avatar" });
        const avatarPreview = await createObjUrl(meta.id);
        if (oldAvatarId && oldAvatarId !== meta.id) {
          await blobStore.removeItem(oldAvatarId).catch(() => {});
          await metaStore.removeItem(oldAvatarId).catch(() => {});
          await syncStore.removeItem(`profileFile:${oldAvatarId}`).catch(() => {});
        }
        return { avatarFileId: meta.id, avatarPreview: avatarPreview || "", avatar: "" };
      }

      async function addProfileDocuments(files) {
        const existing = await getProfileDocuments();
        const accepted = [];
        let total = existing.reduce((sum, document) => sum + (document.size || 0), 0);
        for (const file of Array.from(files || [])) {
          if (existing.length + accepted.length >= PROFILE_DOCUMENT_MAX_COUNT) break;
          if (!file.size || file.size > PROFILE_DOCUMENT_MAX_BYTES) continue;
          if (total + file.size > PROFILE_DOCUMENT_TOTAL_MAX_BYTES) break;
          const meta = await storeFileLF(file, { profileId: S.user?.id, role: "profile-document" });
          await queueSync("profileFile", { ...meta, role: "profile-document" });
          accepted.push({ id: meta.id, name: meta.name, mimeType: meta.mimeType, size: meta.size, type: meta.type, createdAt: meta.createdAt });
          total += file.size;
        }
        if (!accepted.length && files?.length) throw new Error("문서는 파일당 10MB, 총 25MB, 최대 10개까지 저장할 수 있습니다.");
        return [...existing, ...accepted];
      }

      async function removeProfileDocument(documentId) {
        const documents = await getProfileDocuments();
        const nextDocuments = documents.filter((document) => document.id !== documentId);
        await blobStore.removeItem(documentId).catch(() => {});
        await metaStore.removeItem(documentId).catch(() => {});
        await syncStore.removeItem(`profileFile:${documentId}`).catch(() => {});
        await updateSyncCount();
        return nextDocuments;
      }

                <div id="profile-doc-list" style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">${(profile.documents || []).map((document) => `<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;background:rgba(255,255,255,.05);padding:7px 9px;border-radius:6px;font-size:12px;"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(document.name)} · ${fmtSize(document.size || 0)}</span><button type="button" class="profile-doc-remove" data-id="${escHtml(document.id)}" style="border:0;background:none;color:#f87171;cursor:pointer;">삭제</button></div>`).join("") || '<span class="form-hint">저장된 문서가 없습니다.</span>'}</div>
              </div>
              <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px;"><button class="auth-btn outline" id="profile-cancel" style="width:auto;margin:0;padding:10px 14px;">취소</button><button class="auth-btn primary" id="profile-save" style="width:auto;margin:0;padding:10px 14px;">저장</button></div>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        const close = () => closeModalById("profile-modal");
        overlay.querySelector("#profile-close")?.addEventListener("click", close);
        overlay.querySelector("#profile-cancel")?.addEventListener("click", close);
        overlay.addEventListener("click", (event) => { if (event.target === overlay) close(); });
        overlay.querySelectorAll(".profile-doc-remove").forEach((button) => {
          button.addEventListener("click", async () => {
            try {
              const documents = await removeProfileDocument(button.dataset.id);
              const saved = await saveDeviceProfile({ documents });
              setState({ user: saved });
              await queueSync("profile", saved);
              renderProfileModal();
              toast("문서를 이 기기에서 삭제했습니다.", "success");
            } catch (error) {
              toast(error instanceof Error ? error.message : "문서를 삭제하지 못했습니다.", "error");
            }
          });
        });
        overlay.querySelector("#profile-save")?.addEventListener("click", async () => {
          const saveButton = overlay.querySelector("#profile-save");
          const username = overlay.querySelector("#profile-name").value.trim();
          const avatarUrl = overlay.querySelector("#profile-avatar").value.trim();
          const bio = overlay.querySelector("#profile-bio").value.trim();
          const googleEmail = overlay.querySelector("#profile-google-email").value.trim();
          const googlePassword = overlay.querySelector("#profile-google-password").value;
          const avatarFile = overlay.querySelector("#profile-image-file").files?.[0];
          const documentFiles = overlay.querySelector("#profile-doc-files").files;
          if (!username) {
            toast("표시 이름을 입력하세요.", "error");
            return;
          }
          if (avatarUrl && !/^https:\/\//i.test(avatarUrl)) {
            toast("아바타 URL은 HTTPS 주소여야 합니다.", "error");
            return;
          }
          saveButton.disabled = true;
          try {
            const avatarChanges = avatarFile ? await saveProfileAvatar(avatarFile) : {};
            const documents = documentFiles?.length ? await addProfileDocuments(documentFiles) : await getProfileDocuments();
            if (googleEmail && !googleEmail.includes("@")) throw new Error("Google 계정 이메일을 확인하세요.");
            if (googlePassword && googlePassword.length < 4) throw new Error("비밀번호는 4자 이상이어야 합니다.");
            const saved = await saveDeviceProfile({
              username,
              // 업로드한 파일이 있으면 로컬 파일이 외부 URL보다 우선합니다.
              avatar: avatarFile ? "" : avatarUrl,
              bio,
              email: googleEmail,
              localGoogleAccount: Boolean(googleEmail),
              ...(googlePassword ? { localPasswordConfigured: true } : {}),
              documents,
              ...avatarChanges,
            });
            setState({ user: saved });
            await queueSync("profile", saved);
            if (S.account?.connected) void flushSyncQueue();
            toast("프로필 이미지·문서를 이 기기에 저장했습니다.", "success");
            close();
          } catch (error) {
            toast(error instanceof Error ? error.message : "프로필을 저장하지 못했습니다.", "error", 5000);
          } finally {
            saveButton.disabled = false;
          }
        });
      }

      async function renderAccountModal() {

        const config = await getCloudConfig();

        overlay.innerHTML = `
          <div class="modal-box" style="max-width:540px;">
            <div class="modal-header"><div class="modal-title">선택적 계정 연결</div><button class="modal-close" id="account-close">${iconSvg("X", 20)}</button></div>
            <div class="modal-body">
