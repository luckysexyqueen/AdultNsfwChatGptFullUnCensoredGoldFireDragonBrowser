<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoldFireDragon 일본 서버 검색</title><style>body{font:16px system-ui;background:#111d33;color:#fff;max-width:680px;margin:6vh auto;padding:20px}input{width:70%;padding:12px}button{padding:12px}a{color:#90caff}li{margin:12px 0}.note{color:#ccc}</style></head><body><h1>🇯🇵 GoldFireDragon 일본 서버 검색</h1><p class="note">한국어 Google 일본 검색 제안은 Vercel API를 경유합니다. VPN 연결 및 일본 출구 IP는 보장되지 않습니다.</p><form id="search"><input name="q" required maxlength="180" placeholder="한국어 검색어"><button>검색</button></form><p id="status" role="status"></p><ul id="results"></ul><p><a href="./GoldFireDragonBrowser.html">← GoldFireDragonBrowser로 돌아가기</a></p><script>
document.getElementById('search').addEventListener('submit',async e=>{
e.preventDefault();const q=e.target.elements.q.value.trim(),status=document.getElementById('status'),list=document.getElementById('results');list.replaceChildren();status.textContent='검색 중…';
try{const r=await fetch('/api/jp-search?q='+encodeURIComponent(q));if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();status.textContent='서버 실행 리전: '+(d.executionRegion||'미확인')+' · 일본 출구 IP 미검증';for(const term of [d.query,...d.suggestions]){const li=document.createElement('li'),a=document.createElement('a');a.textContent=term;a.href='https://www.google.co.jp/search?'+new URLSearchParams({q:term,gl:'jp',hl:'ko',safe:'off'});a.target='_blank';a.rel='noopener noreferrer';li.append(a);list.append(li);}}catch(err){status.textContent='API 호출 실패: '+err.message+' (Vercel 배포 확인 필요)';}
});</script></body></html>
