app = "goldfiredragon-node-server"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.node-server"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  GFD_STATIC_ROOT = "/app/site-dist"
  GFD_DEPLOYMENT_REGION = "nrt"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
