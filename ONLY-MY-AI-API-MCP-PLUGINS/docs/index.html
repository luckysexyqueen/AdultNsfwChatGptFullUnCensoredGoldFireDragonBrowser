<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spec Direct MCP</title><style>body{font:16px system-ui;max-width:680px;margin:6vh auto;padding:24px;background:#111827;color:#f9fafb}section{padding:24px;border:1px solid #475569;border-radius:16px}button{padding:12px;border-radius:8px;cursor:pointer}code{overflow-wrap:anywhere}p{line-height:1.6}</style><section><h1>Spec Direct MCP</h1><p>Cloudflare Workers에 배포된 MCP 서버 연결 주소입니다. GitHub Pages는 서버를 실행하지 않습니다.</p><p id="status"></p><p><code id="url"></code></p><button id="copy" disabled>Copy MCP URL</button><p><a id="link" rel="noopener noreferrer" target="_blank">MCP 주소</a></p></section><script>const url="";document.getElementById('status').textContent=url?'MCP URL 준비됨 (서버 연결 검증은 별도)':'MCP_PUBLIC_URL이 설정되지 않았습니다.';document.getElementById('url').textContent=url||'미설정';document.getElementById('copy').disabled=!url;document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(url);document.getElementById('status').textContent='URL 복사 완료';};if(url){document.getElementById('link').href=url;document.getElementById('link').textContent='주소 열기';}else{document.getElementById('link').hidden=true;}</script></html>
