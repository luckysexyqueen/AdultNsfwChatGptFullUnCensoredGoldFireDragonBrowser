<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoldFireDragon Browser Native Web Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <style>
    body { margin:0; background:#111; color:#fff; padding:20px; font-family:system-ui,sans-serif; }
    #terminal { height: min(70vh,650px); background:#000; border-radius:8px; padding:12px; }
    #status { color:#a8d8ff; min-height:1.5em; }
  </style>
</head>
<body>
  <h1>🔒 브라우저 독립형 가상 터미널</h1>
  <p>브라우저 안에서 JavaScript/Node 호환 샌드박스를 실행합니다. 실제 Linux 커널이나 OpenVPN 터널은 아닙니다.</p>
  <p id="status" role="status">터미널 초기화 중...</p>
  <div id="terminal" aria-label="WebContainer terminal"></div>
  <script type="module">
    import { Terminal } from 'https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/+esm';
    import { WebContainer } from 'https://cdn.jsdelivr.net/npm/@webcontainer/api@1.6.1/+esm';

    const status = document.getElementById('status');
    const term = new Terminal({ cursorBlink: true, convertEol: true, theme: { background:'#000000' } });
    term.open(document.getElementById('terminal'));
    const report = (message) => { status.textContent = message; term.writeln(message); };
    try {
      if (!crossOriginIsolated) throw new Error('WebContainer는 HTTPS 및 COOP/COEP 교차 출처 격리 헤더가 필요합니다.');
      report('WebContainer 부팅 중...');
      const instance = await WebContainer.boot();
      const shell = await instance.spawn('jsh', [], { terminal: { cols: term.cols, rows: term.rows } });
      shell.output.pipeTo(new WritableStream({ write(chunk) { term.write(chunk); } })).catch(error=>report('출력 오류: '+error.message));
      const writer = shell.input.getWriter();
      term.onData(data => { writer.write(data).catch(error=>report('입력 오류: '+error.message)); });
      report('가상 터미널 준비 완료');
    } catch (error) {
      report('실행 실패: '+error.message);
      term.writeln('현재 브라우저나 호스팅에서 WebContainer 실행이 지원되지 않을 수 있습니다.');
    }
  </script>
</body>
</html>
